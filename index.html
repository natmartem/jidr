<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jidr Arabic</title>
<meta name="description" content="Learn Arabic by roots">
<meta name="theme-color" content="#EEF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1A1E" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jidr">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout concept: a sticky header with tabs, then one column of cards. Root letters are always amber so the eye learns to find them. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#12232A; --mute:#566B70; --line:#D2DCDA;
  --accent:#0B5F66; --accent-ink:#FFFFFF; --tint:#DCEBEA;
  --root:#B4630A; --root-tint:#F7E6D0;
  --good:#1F7A3F; --good-tint:#DDF0E3; --bad:#B3261E; --bad-tint:#F8DEDB;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest','Noto Sans','Segoe UI',system-ui,sans-serif;
  --f-ar:'Amiri','Noto Naskh Arabic','Geeza Pro','Traditional Arabic',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1A1E; --surface:#14262B; --ink:#E6F0EE; --mute:#93AAAE; --line:#263C42;
  --accent:#5CC4C9; --accent-ink:#06282B; --tint:#1B3A3F;
  --root:#F0A04B; --root-tint:#3A2A14;
  --good:#5BC47E; --good-tint:#16301F; --bad:#FF8A80; --bad-tint:#3A1B19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A1E; --surface:#14262B; --ink:#E6F0EE; --mute:#93AAAE; --line:#263C42;
  --accent:#5CC4C9; --accent-ink:#06282B; --tint:#1B3A3F;
  --root:#F0A04B; --root-tint:#3A2A14;
  --good:#5BC47E; --good-tint:#16301F; --bad:#FF8A80; --bad-tint:#3A1B19; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:760px;margin:0 auto;padding-block:0 56px}
h1,h2,h3,p{margin:0}
h2{font:700 15px/1.3 var(--f-display);letter-spacing:.01em;text-wrap:balance}
h3{font:600 15px/1.3 var(--f-body)}
small,.muted{color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.55}
.rt{color:var(--root)}
.l-ru{color:var(--mute)}
body[data-lang="en"] .l-ru{display:none}
body[data-lang="ru"] .l-en{display:none}
body[data-lang="both"] .l-en+.l-ru::before{content:" · "}
.bl .l-en,.bl .l-ru{display:block}
body[data-lang="both"] .bl .l-en+.l-ru::before{content:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line)}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-ar{font-size:34px;line-height:1;color:var(--root)}
.brand b{font:700 15px var(--f-display);display:block}
.brand small{font-size:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;padding:5px 9px;font-size:12px;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--tint);padding:2px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.pill.root{background:var(--root-tint);color:var(--root)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);margin-top:8px}
.tabs button{border:0;background:transparent;padding:10px 2px 9px;font-weight:500;font-size:13px;color:var(--mute);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-top:18px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.lead{max-width:62ch;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary .l-ru{color:inherit;opacity:.85}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* vowel marks */
.marks{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:10px}
.mk{background:var(--tint);border-radius:10px;padding:8px 6px;text-align:center}
.mk .ar{font-size:34px;line-height:1.3}
.mk b{display:block;font-size:13px}
.mk small{font-size:11.5px;display:block;min-width:0}

/* letter groups */
.glist{display:flex;flex-direction:column;gap:10px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grp-h{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:12px 16px;text-align:left}
.grp-n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font:700 12px var(--f-display)}
.grp.done .grp-n{background:var(--good);color:var(--surface)}
.grp-t{flex:1;min-width:0}
.grp-t b{display:block}
.grp-t small{display:block}
.grp-l{font-size:26px;letter-spacing:.12em;direction:rtl;font-family:var(--f-ar);white-space:nowrap}
.grp-b{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.lcard{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.lcard:last-of-type{border-bottom:0}
.big{font-size:60px;line-height:1.2;text-align:center;color:var(--accent)}
.lc-meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.lc-meta .nm{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.tr{font-style:italic;color:var(--mute)}
.dots{display:inline-block;background:var(--root-tint);color:var(--root);border-radius:6px;padding:0 8px;font-size:12.5px;font-weight:500;align-self:flex-start}
.snd{font-size:13.5px}
.snd .lg{display:inline-block;width:24px;font-size:11px;font-weight:600;color:var(--mute)}
.forms{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fm{text-align:center;min-width:56px;background:var(--tint);border-radius:8px;padding:2px 8px 3px}
.fm .ar{font-size:30px;line-height:1.35;display:block}
.fm small{font-size:10.5px;display:block}
.tip{background:var(--root-tint);border-radius:10px;padding:10px 12px;font-size:13.5px}
.tip .ar{font-size:22px;color:var(--ink)}
.tip b{color:var(--root)}

/* roots */
.unit{display:flex;flex-direction:column;gap:8px}
.unit>h2{padding-top:6px}
details.root{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.root>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
details.root>summary::-webkit-details-marker{display:none}
.r-ar{font-size:34px;line-height:1.3;letter-spacing:.18em;color:var(--root);min-width:84px;text-align:center}
.r-t{flex:1;min-width:0}
.r-t b{display:block}
.r-t small{display:block}
.chev{flex:none;transition:transform .15s;color:var(--mute)}
details[open] .chev{transform:rotate(90deg)}
.words{list-style:none;margin:0;padding:0 16px 8px;display:flex;flex-direction:column}
.w{display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr);gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.w-ar{font-size:32px;line-height:1.4;text-align:center}
.w-i{min-width:0;display:flex;flex-direction:column;gap:2px}
.w.locked .w-ar{opacity:.55}
.tag{display:inline-block;font-size:11px;border-radius:5px;padding:0 6px;background:var(--tint);color:var(--mute);margin-left:4px}
.need{font-size:12px;color:var(--root)}
.need .ar{font-size:18px;margin-inline:2px}
.ok{font-size:12px;color:var(--good)}

/* patterns */
.pat-t{font-size:40px;text-align:center;line-height:1.4;margin:6px 0 2px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.chip{background:var(--tint);border-radius:10px;padding:8px 10px;text-align:center;min-width:0}
.chip .ar{font-size:28px;display:block}
.chip.locked .ar{opacity:.55}
.chip b{display:block;font-size:13px}
.chip small{font-size:12px}

/* practice + quiz */
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.qhead{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:8px;border-radius:6px;background:var(--tint);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qbox{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px 0 4px}
.qbig{font-size:96px;line-height:1.3;color:var(--accent)}
.qword{font-size:64px;line-height:1.4}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;min-height:54px;text-align:center;min-width:0}
.opt .ar{font-size:36px;line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-tint);border-color:var(--good)}
.opt.wrong{background:var(--bad-tint);border-color:var(--bad)}
.fb{border-radius:10px;padding:10px 12px;font-size:14px}
.fb.right{background:var(--good-tint)}
.fb.wrong{background:var(--bad-tint)}
.fb .ar{font-size:24px}
.score{font:700 44px var(--f-display);text-align:center;color:var(--accent)}
.unlock{display:flex;flex-wrap:wrap;gap:8px}
.unlock span{background:var(--root-tint);border-radius:10px;padding:4px 10px;text-align:center}
.unlock .ar{font-size:26px;display:block}
.unlock small{font-size:11.5px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.opt.right{animation:pop .3s}
@media (prefers-reduced-motion:reduce){.opt.right{animation:none}.prog i,.chev{transition:none}}
@media (max-width:420px){.grp-l{font-size:22px}.big{font-size:52px}.qbig{font-size:80px}.qword{font-size:52px}.lcard{grid-template-columns:64px minmax(0,1fr)}}

/* manage tab */
.mg{display:flex;flex-direction:column;gap:10px}
.mg .lead{max-width:none}
.ta{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ta.sm{min-height:64px}
label.btn{display:inline-block}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
.msg.ok{background:var(--good-tint)}
.msg.bad{background:var(--bad-tint)}
.msg ul{margin:4px 0 0;padding-left:18px}
.packrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.packrow:first-of-type{border-top:0}
.packrow>div{flex:1;min-width:0}
.packrow b,.packrow small{display:block}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span:last-child{text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="bar-row">
      <div class="brand">
        <span class="ar brand-ar" lang="ar">جذر</span>
        <div><b>Jidr</b><small>jidr = root. Learn the root, get the family.</small></div>
      </div>
      <div class="lang" role="group" aria-label="Explanation language">
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="both" aria-pressed="true">EN + RU</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
      <button type="button" role="tab" data-tab="letters">Letters</button>
      <button type="button" role="tab" data-tab="roots">Roots</button>
      <button type="button" role="tab" data-tab="patterns">Patterns</button>
      <button type="button" role="tab" data-tab="practice">Practice</button>
      <button type="button" role="tab" data-tab="manage">Manage</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<script>
// Dots: [English, Russian]
const D={
  n:["no dots","без точек"],
  a1:["1 dot above","1 точка сверху"],a2:["2 dots above","2 точки сверху"],a3:["3 dots above","3 точки сверху"],
  b1:["1 dot below","1 точка снизу"],b2:["2 dots below","2 точки снизу"],i1:["1 dot inside the curve","1 точка внутри изгиба"]
};

const L=[
["ا","alif","ā","a long “a”, like the a in father","долгий «а», как в «ма-ама». Просто палочка","n",0,"alif",1],
["ب","bāʾ","b","b as in bat","«б»","b1",1,"ba",1],
["ت","tāʾ","t","t as in tea","«т»","a2",1,"ba",1],
["ث","thāʾ","th","th as in think, tongue tip between the teeth","в русском нет: кончик языка между зубами, как шепелявое «с»","a3",1,"ba",1],
["ج","jīm","j","j as in jam","«дж», как в «джаз»","i1",1,"jim",2],
["ح","ḥāʾ","ḥ","a breathy h from deep in the throat, like fogging a mirror","выдох из глубины горла, как будто дышишь на стекло. Не русское «х»","n",1,"jim",2],

["ض","ḍād","ḍ","a heavy d, same trick as ṣ","тяжёлое «д», тот же приём, что у ṣ","a1",1,"sad",4],
["ط","ṭāʾ","ṭ","a heavy t","тяжёлое «т»","n",1,"ta",5],
["ظ","ẓāʾ","ẓ","a heavy dh","тяжёлое «з» с языком между зубами","a1",1,"ta",5],
["ع","ʿayn","ʿ","a squeezed-throat “ah”, no English match","«а» со сжатым горлом. В русском нет","n",1,"ayn",5],
["غ","ghayn","gh","a gargled r, like the French r","картавое «г», как французское r или южнорусское «г»","a1",1,"ayn",5],
["ف","fāʾ","f","f as in fan","«ф»","a1",1,"fa",6],
["ق","qāf","q","a k said far back in the throat","«к» глубоко в горле","a2",1,"fa",6],
["ك","kāf","k","k as in kite","«к»","n",1,"kaf",6],
["ل","lām","l","l as in lamp","«л». Высокая палочка","n",1,"lam",6],
["م","mīm","m","m as in moon","«м». Маленькая петля","n",1,"mim",6],
["ن","nūn","n","n as in net","«н»","a1",1,"ba",6],
["ه","hāʾ","h","h as in hat, just a breath","лёгкий выдох «х»","n",1,"ha",7],
["و","wāw","w / ū","w as in water, or a long “oo”","«в» как в английском water, или долгое «у»","n",0,"waw",7],
["ي","yāʾ","y / ī","y as in yes, or a long “ee”","«й» или долгое «и»","b2",1,"ba",7],
["ة","tāʾ marbūṭa","-a","the “a” ending of words like madrasa (only at the end of a word)","окончание «-а», как в «мадраса» (только в конце слова)","a2",0,"ha",7]
];

const GROUPS=[
{id:1,t:"Start here",en:"One stick and the boat family. The body is the same, the dots decide the letter.",ru:"Палочка и семейство «лодочек». Форма одна, букву решают точки.",L:"ابتث"},
{id:2,t:"The hook family",en:"One shape, three letters: dot inside, no dot, dot above.",ru:"Одна форма, три буквы: точка внутри, без точки, точка сверху.",L:"جحخ"},
{id:3,t:"Short stoppers",en:"Four letters that never join the next letter. Two pairs, each split by one dot.",ru:"Четыре буквы, которые не соединяются со следующей. Две пары, в каждой отличие в одной точке.",L:"دذرز"},
{id:4,t:"Teeth and loops",en:"s and sh, then the heavy twins ṣ and ḍ.",ru:"s и sh, затем «тяжёлые» близнецы ṣ и ḍ.",L:"سشصض"},
{id:5,t:"Heavy and throat",en:"Heavy ṭ and ẓ, then the throat pair ʿ and gh.",ru:"Тяжёлые ṭ и ẓ, затем горловая пара ʿ и gh.",L:"طظعغ"},
{id:6,t:"Everyday six",en:"f and q (dots tell them apart), then k, l, m, n.",ru:"f и q (различаются точками), затем k, l, m, n.",L:"فقكلمن"},
{id:7,t:"Last letters",en:"h, w, y, plus the ending ة that closes many nouns.",ru:"h, w, y и окончание ة, которое замыкает многие существительные.",L:"هوية"}
];

// words: [arabic, translit, EN, RU, patterns]

{u:1,r:"علم",tr:"ʿ-l-m",en:"know",ru:"знать",w:[

["عِلم","ʿilm","knowledge, science","знание, наука",""],
["عالِم","ʿālim","scientist","учёный","dr"],
["مُعَلِّم","muʿallim","teacher","учитель","mu"],
["تَعليم","taʿlīm","education","образование",""]]},
{u:1,r:"كلم",tr:"k-l-m",en:"speak",ru:"говорить",w:[

["كَلِمة","kalima","word","слово","fm"],

function famTips(g){

  return {prompt:`<div class="qbig ar">${f[2]}</div><p>${bi("Which letter is this?","Что это за буква?")} <span class="muted">(${bi(FORMNAME[f[0]][0],FORMNAME[f[0]][1])})</span></p>`,
    opts,ans:l.c,fb:`<span class="ar">${l.c}</span> = <b>${l.n}</b> (${l.tr}). ${bi(l.dots[0],l.dots[1])}.`};
}
function qFind(pool,ctx){
  const l=pick(pool);
  const same=shuffle(ctx.filter(x=>x!==l&&x.fam===l.fam)),rest=shuffle(ctx.filter(x=>x!==l&&x.fam!==l.fam));
  const ds=same.concat(rest).slice(0,3);
  const opts=shuffle([l].concat(ds)).map(x=>({k:x.c,html:`<span class="ar">${x.c}</span>`}));
  return {prompt:`<p style="font-size:17px">${bi("Find <b>"+l.n+"</b> ("+l.tr+")","Найдите букву <b>"+l.n+"</b> ("+l.tr+")")}</p><p class="snd muted">${bi(l.en,l.ru)}</p>`,
    opts,ans:l.c,fb:`<span class="ar">${l.c}</span> = <b>${l.n}</b>: ${bi(l.dots[0],l.dots[1])}.`};
}
function qWord(){
  const rw=readableWords();if(!rw.length)return null;
  const w=pick(rw),others=shuffle(ALLW.filter(x=>x!==w&&x.en!==w.en)).slice(0,3);
  const opts=shuffle([w].concat(others)).map(x=>({k:String(x.id),html:bi(esc(x.en),esc(x.ru))}));
  const rootLine=w.root.r?`<br>${bi("Root","Корень")} <span class="ar">${spaced(w.root.r)}</span> <span class="tr">${w.root.tr}</span> · ${bi(esc(w.root.en),esc(w.root.ru))}`:"";
  return {prompt:`<div class="qword ar" lang="ar">${w.root.r?hl(w.ar,w.root):esc(w.ar)}</div><p>${bi("What does it mean?","Что это значит?")}</p>`,
    opts,ans:String(w.id),fb:`<span class="ar">${esc(w.ar)}</span> <b>${w.tr}</b> = ${bi(esc(w.en),esc(w.ru))}${rootLine}`};
}
function qRoot(){
  const cand=ROOTS.filter(r=>r.r&&ALLW.filter(w=>w.root===r&&readable(w)).length>=3);
  if(!cand.length)return null;
  const r=pick(cand),ws=shuffle(ALLW.filter(w=>w.root===r&&readable(w))).slice(0,3);
  const ds=shuffle(ROOTS.filter(x=>x.r&&x!==r)).slice(0,3);
  const opts=shuffle([r].concat(ds)).map(x=>({k:x.r,html:`<span class="ar" style="letter-spacing:.2em">${spaced(x.r)}</span><br><span class="tr">${x.tr}</span>`}));
  return {prompt:`<p>${bi("These words share one root. Which?","У этих слов общий корень. Какой?")}</p><div class="chips" style="width:100%">${ws.map(w=>`<div class="chip"><span class="ar">${esc(w.ar)}</span><b>${w.tr}</b><small>${bi(esc(w.en),esc(w.ru))}</small></div>`).join("")}</div>`,
    opts,ans:r.r,fb:`${bi("Root","Корень")} <span class="ar">${spaced(r.r)}</span> <b>${r.tr}</b> = ${bi(esc(r.en),esc(r.ru))}. ${ws.map(w=>`<span class="ar">${hl(w.ar,r)}</span>`).join(" · ")}`};
}

  const known=Q.group&&S.learned.includes(Q.group)?`<p class="ok" style="text-align:center">✓ ${bi("Group marked as known.","Группа отмечена как выученная.")}</p>`:(Q.group?`<p class="muted" style="text-align:center">${bi("Score 80% or more to mark the group as known.","Наберите 80% и больше, чтобы отметить группу выученной.")}</p>`:"");

const errList=errs=>`<ul>${errs.slice(0,8).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`+(errs.length>8?`<small>…and ${errs.length-8} more</small>`:"");

/* A lesson pack is the same shape as the built-in data:
   {id, title?, units:{"5":["English","Русский"]}, roots:[{u,r,tr,en,ru,w:[[arabic,translit,en,ru,"pattern codes"]]}], pats?:{...}} */
function strWalk(v,path,errs){
  if(typeof v==="string"){
    if(/[<>]/.test(v))errs.push(path+': text contains "<" or ">"');
    else if(v.length>400)errs.push(path+": text is too long");
  }else if(Array.isArray(v))v.forEach((x,i)=>strWalk(x,path+"["+i+"]",errs));
  else if(v&&typeof v==="object")Object.keys(v).forEach(k=>strWalk(v[k],path+"."+k,errs));
}
function validatePack(raw,others){
  if(!raw||typeof raw!=="object"||Array.isArray(raw))return{errs:["This is not a lesson pack (expected one JSON object)."]};
  const errs=[];
  strWalk(raw,"pack",errs);
  if(typeof raw.id!=="string"||!/^[a-z0-9][a-z0-9_-]{0,39}$/i.test(raw.id))errs.push('"id" must be a short name such as "unit5-mind" (letters, numbers, - or _).');
  const units={},pats={};
  if(raw.units!=null){
    if(typeof raw.units!=="object"||Array.isArray(raw.units))errs.push('"units" must look like {"5":["Title","Название"]}.');
    else Object.keys(raw.units).forEach(k=>{
      const t=raw.units[k];
      if(!Array.isArray(t)||typeof t[0]!=="string"||typeof t[1]!=="string"||!t[0]||!t[1])errs.push('Unit "'+k+'" needs ["English title","Русское название"].');
      else units[k]=[t[0],t[1]];
    });
  }
  if(raw.pats!=null){
    if(typeof raw.pats!=="object"||Array.isArray(raw.pats))errs.push('"pats" must be an object of pattern definitions.');
    else Object.keys(raw.pats).forEach(k=>{
      const p=raw.pats[k];
      const parts=p&&Array.isArray(p.parts)&&p.parts.length&&p.parts.every(x=>Array.isArray(x)&&typeof x[0]==="string"&&(x[1]===0||x[1]===1));
      if(!/^[a-z0-9]{1,6}$/i.test(k)||!p||["t","tr","en","ru"].some(f=>typeof p[f]!=="string"||!p[f])||!parts)errs.push('Pattern "'+k+'" needs t, tr, en, ru and parts like [["مَ",0],["ف",1]].');
      else pats[k]={t:p.t,parts:p.parts.map(x=>[x[0],x[1]]),tr:p.tr,en:p.en,ru:p.ru};
    });
  }
  const known=new Set(Object.keys(PATS0)),knownU=new Set(Object.keys(UNITS0)),seen=new Set(ROOTS0.filter(r=>r.r).map(r=>r.r));
  others.forEach(o=>{Object.keys(o.pats||{}).forEach(k=>known.add(k));Object.keys(o.units||{}).forEach(k=>knownU.add(k));o.roots.forEach(r=>{if(r.r)seen.add(r.r)})});
  Object.keys(pats).forEach(k=>known.add(k));Object.keys(units).forEach(k=>knownU.add(k));
  const roots=[];
  if(!Array.isArray(raw.roots)||!raw.roots.length)errs.push('"roots" must be a list with at least one root.');
  else{
    if(raw.roots.length>80)errs.push("A pack can hold up to 80 roots. Split it into two packs.");
    raw.roots.forEach((r,i)=>{
      const at="roots["+i+"]";
      if(!r||typeof r!=="object"||Array.isArray(r)){errs.push(at+" is not an object.");return}
      const u=String(r.u);
      if(r.u==null||!knownU.has(u))errs.push(at+': unit "'+r.u+'" is not defined. Add it to "units".');
      if(typeof r.r!=="string")errs.push(at+': "r" (the root letters) is missing.');
      else if(r.r){
        if(!/^[ء-ي]{3,4}$/.test(r.r))errs.push(at+': root "'+r.r+'" must be 3 or 4 Arabic letters without vowel marks.');
        else if(seen.has(r.r))errs.push(at+": root "+r.r+" is already in the app.");
        else seen.add(r.r);
        if(typeof r.tr!=="string"||!r.tr)errs.push(at+': "tr" (for example "k-t-b") is missing.');
      }
      if(typeof r.en!=="string"||!r.en||typeof r.ru!=="string"||!r.ru)errs.push(at+': "en" and "ru" meanings are needed.');
      const ws=[];
      if(!Array.isArray(r.w)||!r.w.length)errs.push(at+': "w" needs at least one word.');
      else r.w.forEach((w,j)=>{
        const wa=at+".w["+j+"]";
        if(!Array.isArray(w)||w.length<4)errs.push(wa+": a word is [arabic, transliteration, English, Russian, patterns].");
        else if(!ARABIC.test(String(w[0]))||[1,2,3].some(k=>typeof w[k]!=="string"||!w[k]))errs.push(wa+": needs Arabic text, a transliteration and both meanings.");
        else{
          const codes=String(w[4]||"").split(" ").filter(Boolean),bad=codes.filter(c=>!known.has(c));
          if(bad.length)errs.push(wa+": unknown pattern code "+bad.join(", ")+".");
          ws.push([String(w[0]),w[1],w[2],w[3],codes.join(" ")]);
        }
      });
      roots.push({u,r:typeof r.r==="string"?r.r:"",tr:typeof r.tr==="string"?r.tr:"",en:String(r.en||""),ru:String(r.ru||""),w:ws});
    });
  }
  if(errs.length)return{errs};
  return{pack:{id:raw.id,title:typeof raw.title==="string"?raw.title:"",units,pats,roots}};
}
const packWords=p=>p.roots.reduce((n,r)=>n+r.w.length,0);

function importPackText(text){
  text=String(text||"").trim().replace(/^```[a-z]*\s*/i,"").replace(/\s*```$/,"");
  if(!text)return setMsg("pack","bad","Paste a lesson pack first, or choose a file.");
  let raw;try{raw=JSON.parse(text)}catch(e){return setMsg("pack","bad","This is not valid JSON ("+esc(e.message)+"). Copy the whole code block from Claude’s reply.")}
  const others=PACKS.filter(p=>!(raw&&raw.id===p.id));
  const res=validatePack(raw,others);
  if(!res.pack)return setMsg("pack","bad","<b>Could not add this pack.</b>"+errList(res.errs));
  const pack=res.pack,existed=PACKS.some(p=>p.id===pack.id),next=others.concat([pack]);
  if(!savePacks(next))return setMsg("pack","bad","Could not save: browser storage is full or blocked.");
  PACKS=next;buildData();
  MSG.pack={kind:"ok",html:`<b>${existed?bi("Updated","Обновлено"):bi("Added","Добавлено")} “${esc(pack.title||pack.id)}”</b> · ${bi("roots","корней")}: ${pack.roots.length}, ${bi("words","слов")}: ${packWords(pack)}. <button type="button" class="btn" data-goto="roots">${bi("Open Roots","К корням")}</button>`};
  render();
}

function claudePrompt(){
  const units=Object.keys(UNITS).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(k=>k+" "+UNITS[k][0]).join("; ");
  const roots=ROOTS.filter(r=>r.r).map(r=>r.tr).join(", ");
  const pats=Object.keys(PATS).map(k=>k+" = "+PATS[k].t+" ("+PATS[k].tr+")").join("; ");
  return `Make a lesson pack for my Jidr Arabic app. Reply with ONE JSON code block and nothing else.

Topic: [describe the topic, or paste the words you want]

Format:
{"id":"unit5-mind","title":"Mind","units":{"5":["Mind","Ум"]},"roots":[{"u":5,"r":"فكر","tr":"f-k-r","en":"think","ru":"думать","w":[["فَكَّرَ","fakkara","he thought","он думал",""],["فِكرة","fikra","idea","идея","fm"]]}],"pats":{}}

Rules:
- "id" is a new short name. "units" lists the unit number(s) with [English, Russian] titles. Reuse an existing unit number or add a new one.
- Each root: "r" is the 3 (or 4) consonants without vowel marks, "tr" is dashed transliteration like k-t-b, "en"/"ru" give the core meaning. 3 to 6 words per root.
- Each word: [Arabic with full vowel marks, transliteration, English, Russian, pattern codes]. Pattern codes are space-separated, or "" for none.
- Pattern codes available: ${pats}.
- Transliteration style: ā ī ū ḥ ṣ ḍ ṭ ẓ ʿ ʾ kh sh gh dh th.
- Do not use the characters < or >.
- "pats" is only needed to define a new pattern, otherwise {}.
- Do not repeat roots that are already in the app.

Already in the app:
Units: ${units}
Roots: ${roots}`;
}

function restoreText(text){
  text=String(text||"").trim();
  if(!text)return setMsg("backup","bad","Paste a backup first, or choose a file.");
  let o;try{o=JSON.parse(text)}catch(e){return setMsg("backup","bad","This is not a valid backup file.")}
  if(!o||o.app!=="jidr"||!o.state||typeof o.state!=="object"||!Array.isArray(o.state.learned))return setMsg("backup","bad","This does not look like a Jidr backup.");
  const packs=[],errs=[];
  (Array.isArray(o.packs)?o.packs:[]).forEach((raw,i)=>{const r=validatePack(raw,packs);if(r.pack)packs.push(r.pack);else errs.push("Pack "+(i+1)+": "+r.errs[0])});
  if(errs.length)return setMsg("backup","bad","<b>Some lesson packs in this backup could not be read.</b>"+errList(errs));
  if(!confirm("Replace the progress and lessons on this device with this backup?"))return;
  if(!savePacks(packs))return setMsg("backup","bad","Could not save: browser storage is full or blocked.");
  const st=migrate(Object.assign({ver:1,learned:[],lang:"both",best:0,lastBackup:0},o.state));
  st.learned=st.learned.filter(id=>GROUPS.some(g=>g.id===id));
  if(!["en","ru","both"].includes(st.lang))st.lang="both";
  st.tab="manage";S=st;PACKS=packs;save();buildData();
  MSG.backup={kind:"ok",html:bi("Backup restored.","Копия восстановлена.")};
  render();
}

  <div class="kv"><span>${bi("Version","Версия")}</span><span>${APP_VERSION}</span></div></div>
  ${standalone?"":deferredInstall?`<div class="row"><button type="button" class="btn primary" data-act="install">${bi("Install app","Установить приложение")}</button></div>`
   :`<p class="muted">${bi("To install: browser menu ⋮ → Install app (or Add to Home screen). On iPhone: Share → Add to Home Screen.","Чтобы установить: меню браузера ⋮ → «Установить приложение» (или «Добавить на главный экран»). На iPhone: «Поделиться» → «На экран Домой».")}</p>`}
  ${storageOK?"":`<div class="msg bad">${bi("This browser cannot save data (private mode?). Progress will be lost when you close the page.","Этот браузер не может сохранять данные (приватный режим?). Прогресс пропадёт при закрытии страницы.")}</div>`}`;
}
const refreshDevice=()=>{const el=$("#dev-card");if(el)el.innerHTML=deviceInner()};

function renderManage(){
  const baseR=ROOTS0.filter(r=>r.r).length,baseW=ROOTS0.reduce((n,r)=>n+r.w.length,0);
  const rows=PACKS.map(p=>`<div class="packrow"><div><b>${esc(p.title||p.id)}</b><small>${bi("roots","корней")}: ${p.roots.length} · ${bi("words","слов")}: ${packWords(p)}</small></div>
    <button type="button" class="btn" data-act="rm" data-id="${esc(p.id)}">${bi("Remove","Удалить")}</button></div>`).join("");
  const last=S.lastBackup?new Date(S.lastBackup).toLocaleDateString():null;
  return `<section class="card mg"><h2>${bi("Add lessons","Добавить уроки")}</h2>
    <p class="lead">${bi("Ask Claude for a lesson pack, then paste it here or load the file. Your progress is not touched.","Попросите Claude сделать пакет уроков, затем вставьте его сюда или загрузите файл. Ваш прогресс не затрагивается.")}</p>
    <textarea id="pack-text" class="ta" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Lesson pack" placeholder='{"id":"unit5-mind", ...}'></textarea>
    <div class="row"><button type="button" class="btn primary" data-act="addpack">${bi("Add lesson","Добавить урок")}</button>
      <label class="btn">${bi("Choose file","Выбрать файл")}<input type="file" id="pack-file" accept=".json,application/json,text/plain" hidden></label>
      <button type="button" class="btn" data-act="prompt">${bi("Copy prompt for Claude","Скопировать запрос для Claude")}</button></div>
    <div id="msg-pack" aria-live="polite">${msgInner("pack")}</div>
    <small class="muted">${bi("The prompt lists what the app already has, so new lessons do not repeat it.","В запросе перечислено, что уже есть в приложении, чтобы новые уроки не повторялись.")}</small></section>
  <section class="card mg"><h2>${bi("Lessons on this device","Уроки на этом устройстве")}</h2>
    <div><div class="packrow"><div><b>${bi("Starter course","Начальный курс")}</b><small>${bi("roots","корней")}: ${baseR} · ${bi("words","слов")}: ${baseW}</small></div></div>${rows}</div>
    <div id="msg-list" aria-live="polite">${msgInner("list")}</div></section>
  <section class="card mg"><h2>${bi("Backup and restore","Резервная копия")}</h2>
    <p class="lead">${bi("Progress and added lessons live only on this phone. Save a backup file now and then, and before changing phones or clearing browser data.","Прогресс и добавленные уроки хранятся только на этом телефоне. Время от времени сохраняйте копию, а также перед сменой телефона или очисткой данных браузера.")}</p>
    <small class="muted">${bi("Last backup","Последняя копия")}: ${last||bi("never","никогда")}</small>
    <div class="row"><button type="button" class="btn primary" data-act="dl">${bi("Download backup","Скачать копию")}</button>
      <button type="button" class="btn" data-act="copybk">${bi("Copy backup","Скопировать копию")}</button></div>
    <textarea id="restore-text" class="ta sm" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Backup to restore" placeholder="Paste a backup here · Вставьте копию сюда"></textarea>
    <div class="row"><button type="button" class="btn" data-act="restore">${bi("Restore from pasted text","Восстановить из текста")}</button>
      <label class="btn">${bi("Choose backup file","Выбрать файл копии")}<input type="file" id="restore-file" accept=".json,application/json,text/plain" hidden></label></div>
    <div id="msg-backup" aria-live="polite">${msgInner("backup")}</div></section>
  <section class="card mg" id="dev-card">${deviceInner()}</section>`;
}
function act(t){
  const a=t.dataset.act;
  if(a==="addpack")return importPackText($("#pack-text").value);
  if(a==="prompt")return copyText(claudePrompt(),"pack","Prompt copied. Paste it into a chat with Claude and describe the lesson.","Запрос скопирован. Вставьте его в чат с Claude и опишите урок.");
  if(a==="rm"){
    const p=PACKS.find(x=>x.id===t.dataset.id);
    if(!p||!confirm("Remove “"+(p.title||p.id)+"”? Your progress is kept."))return;
    const next=PACKS.filter(x=>x!==p);
    if(!savePacks(next))return setMsg("list","bad","Could not save the change.");
    PACKS=next;buildData();MSG.list={kind:"ok",html:bi("Removed.","Удалено.")};return render();
  }
  if(a==="dl"){download("jidr-backup-"+dayStr()+".json",backupJSON());MSG.backup={kind:"ok",html:bi("Backup downloaded. Check your Downloads folder.","Копия скачана. Проверьте папку «Загрузки».")};return render()}
  if(a==="copybk")return copyText(backupJSON(),"backup","Backup copied. Paste it into a note or message to yourself.","Копия скопирована. Вставьте её в заметку или сообщение себе.");
  if(a==="restore")return restoreText($("#restore-text").value);
  if(a==="install"&&deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;refreshDevice()})}
}
document.addEventListener("change",e=>{
  const inp=e.target;
  if(!inp||inp.type!=="file"||!inp.files||!inp.files[0])return;
  const f=inp.files[0],k=inp.id==="pack-file"?"pack":"backup";
  if(f.size>2e6)return setMsg(k,"bad","That file is too large.");
  f.text().then(txt=>{inp.value="";k==="pack"?importPackText(txt):restoreText(txt)}).catch(()=>setMsg(k,"bad","Could not read that file."));
});

/* ---------- Router and events ---------- */
function render(){
  Q=null;
  const v=$("#view");
  const map={letters:renderLetters,roots:renderRoots,patterns:renderPatterns,practice:renderPractice,manage:renderManage};
  if(!map[S.tab])S.tab="letters";
  v.innerHTML=map[S.tab]();
  renderStats();
}
function go(tab){if(tab!==S.tab)MSG={};S.tab=tab;save();try{history.replaceState(null,"","#"+tab)}catch(e){}render();window.scrollTo({top:0})}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.act)return act(t);
  if(t.dataset.tab)return go(t.dataset.tab);
  if(t.dataset.goto)return go(t.dataset.goto);
  if(t.dataset.lang){S.lang=t.dataset.lang;save();return renderStats()}
  if(t.dataset.grp){const id=+t.dataset.grp;openGroup=openGroup===id?null:id;render();
    if(openGroup){const el=document.querySelector(`[data-grp="${id}"]`);if(el)el.scrollIntoView({block:"start"})}return}
  if(t.dataset.know){const id=+t.dataset.know,i=S.learned.indexOf(id);if(i>=0)S.learned.splice(i,1);else S.learned.push(id);save();return render()}
  if(t.dataset.drill){const g=GROUPS.find(x=>x.id===+t.dataset.drill);
    return startQuiz({n:10,group:g.id,gen:groupGen(g),redo:()=>startQuiz(Q.cfg)})}
  if(t.dataset.mix){
    const k=t.dataset.mix;let cfg;
    if(k==="letters"){const ll=learnedLetters();cfg={n:12,gen:()=>Math.random()<0.5?qName(ll,ll):qFind(ll,ll)}}
    if(k==="words")cfg={n:10,gen:qWord};
    if(k==="roots")cfg={n:8,gen:qRoot};
    cfg.cfg=cfg;return startQuiz(cfg)}
  if(t.dataset.k!==undefined&&Q)return answer(t);
  if(t.hasAttribute("data-next"))return nextQ();
  if(t.hasAttribute("data-again")){const c=Q.cfg||{n:Q.n,group:Q.group,gen:Q.gen};return startQuiz({n:c.n,group:c.group,gen:c.gen,cfg:c.cfg})}
  if(t.hasAttribute("data-exit"))return render();
});
(function init(){
  const h=(location.hash||"").slice(1);
  if(TABS.includes(h))S.tab=h;
  window.addEventListener("hashchange",()=>{const x=location.hash.slice(1);if(TABS.includes(x)&&x!==S.tab){S.tab=x;render()}});
  render();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    navigator.serviceWorker.ready.then(()=>{swReady=true;refreshDevice()}).catch(()=>{});
  }
  if(navigator.storage&&navigator.storage.persisted){
    navigator.storage.persisted().then(p=>p||(navigator.storage.persist?navigator.storage.persist():false)).then(p=>{persisted=!!p;refreshDevice()}).catch(()=>{});
  }
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;refreshDevice()});
  window.addEventListener("appinstalled",()=>{deferredInstall=null;refreshDevice()});
})();
</script>
</body>
</html>
