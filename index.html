<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jidr Arabic</title>
<meta name="description" content="Learn Arabic by roots">
<meta name="theme-color" content="#EEF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1A1E" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jidr">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* One column of cards under a sticky header. Root letters are always amber; the letter being asked about is pink. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#12232A; --mute:#566B70; --line:#D2DCDA;
  --accent:#0B5F66; --accent-ink:#FFFFFF; --tint:#DCEBEA;
  --root:#B4630A; --root-tint:#F7E6D0; --hit:#C2185B;
  --good:#1F7A3F; --good-tint:#DDF0E3; --bad:#B3261E; --bad-tint:#F8DEDB;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest','Noto Sans','Segoe UI',system-ui,sans-serif;
  --f-ar:'Amiri','Noto Naskh Arabic','Geeza Pro','Traditional Arabic',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1A1E; --surface:#14262B; --ink:#E6F0EE; --mute:#93AAAE; --line:#263C42;
  --accent:#5CC4C9; --accent-ink:#06282B; --tint:#1B3A3F;
  --root:#F0A04B; --root-tint:#3A2A14; --hit:#FF79B0;
  --good:#5BC47E; --good-tint:#16301F; --bad:#FF8A80; --bad-tint:#3A1B19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A1E; --surface:#14262B; --ink:#E6F0EE; --mute:#93AAAE; --line:#263C42;
  --accent:#5CC4C9; --accent-ink:#06282B; --tint:#1B3A3F;
  --root:#F0A04B; --root-tint:#3A2A14; --hit:#FF79B0;
  --good:#5BC47E; --good-tint:#16301F; --bad:#FF8A80; --bad-tint:#3A1B19; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:760px;margin:0 auto;padding-block:0 64px}
h1,h2,h3,p{margin:0}
h2{font:700 15px/1.3 var(--f-display);letter-spacing:.01em;text-wrap:balance}
h3{font:600 15px/1.3 var(--f-body)}
small,.muted{color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.6}
.rt{color:var(--root)}
.hit{color:var(--hit)}
.l-ru{color:var(--mute)}
body[data-lang="en"] .l-ru,body[data-lang="en"] .t-ru{display:none}
body[data-lang="ru"] .l-en,body[data-lang="ru"] .t-en,body[data-lang="both"] .t-ru{display:none}
body[data-lang="ru"] .l-ru{color:inherit}
body[data-lang="both"] .l-en+.l-ru::before{content:" · "}
.bl .l-en,.bl .l-ru{display:block}
body[data-lang="both"] .bl .l-en+.l-ru::before{content:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-top:10px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-ar{font-size:30px;line-height:1;color:var(--root)}
.brand b{font:700 15px var(--f-display)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:5px 9px;font-size:12px;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--tint);padding:2px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.pill.root{background:var(--root-tint);color:var(--root)}
.pill.warn{background:var(--bad-tint);color:var(--bad)}
.pill.pop{animation:pop .4s}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);margin-top:6px}
.tabs button{border:0;background:transparent;padding:10px 2px 9px;font-weight:500;font-size:13.5px;color:var(--mute);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-top:16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lead{color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary .l-ru,.hero .l-ru,.dr.main .l-ru,.seg button[aria-pressed="true"] .l-ru,.lang .l-ru{color:inherit;opacity:.85}
.btn.big{padding:13px 18px;font-size:16px;width:100%}
.btn.link{border:0;background:none;padding:4px 0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:13.5px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar{height:8px;border-radius:6px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.root i{background:var(--root)}

/* small controls */
.spk{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:0;background:var(--tint);color:var(--accent)}
.spk.big{width:64px;height:64px}
.spk.big svg{width:30px;height:30px}
.spk.playing{background:var(--accent);color:var(--accent-ink)}
.trv{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:0 7px;font-size:12px;color:var(--mute);min-height:26px}
.trs{font-style:italic;color:var(--mute);font-size:13.5px}
.pchip{display:inline-block;border-radius:6px;background:var(--root-tint);padding:0 8px;font-size:18px;line-height:1.5}
.tag{display:inline-block;font-size:11.5px;border-radius:5px;padding:0 6px;background:var(--tint);color:var(--mute)}

/* path */
.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .muted,.hero small{color:inherit;opacity:.8}
.hero .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink);font-weight:600}
.hero-ar{font-size:44px;line-height:1.4;letter-spacing:.08em}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--tint);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.kpi small{font-size:12px}
.steps{display:flex;flex-direction:column;gap:8px}
.st{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.st:disabled{cursor:default}
.st.locked{opacity:.55}
.st.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.st-n{width:30px;height:30px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font:700 12px var(--f-display)}
.st.done .st-n{background:var(--good);color:var(--surface)}
.st.cur .st-n{background:var(--accent);color:var(--accent-ink)}
.st-t{min-width:0}
.st-t b{display:block;font-weight:600;line-height:1.3}
.st-t small{display:block;font-size:12.5px}
.st-ar{font-size:24px;line-height:1.3;color:var(--root);max-width:34vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* step page */
.back{align-self:flex-start;border:0;background:none;color:var(--accent);padding:2px 0;font-weight:500}
.kind{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.lcard{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-top:1px dashed var(--line)}
.lcard:first-of-type{border-top:0}
.big{font-size:64px;line-height:1.2;text-align:center;color:var(--accent)}
.lc-meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.nm{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tr{font-style:italic;color:var(--mute)}
.dots{display:inline-block;background:var(--root-tint);color:var(--root);border-radius:6px;padding:0 8px;font-size:12.5px;font-weight:500;align-self:flex-start}
.snd{font-size:13.5px}
.snd .lg{display:inline-block;width:24px;font-size:11px;font-weight:600;color:var(--mute)}
.forms{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.fm{text-align:center;min-width:56px;background:var(--tint);border-radius:8px;padding:2px 8px 3px}
.fm .ar{font-size:30px;line-height:1.35;display:block}
.fm small{font-size:10.5px;display:block}
.alike{grid-column:1 / -1;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.alike .ar{font-size:24px;line-height:1.2}
.alike .me{color:var(--accent)}
.marks{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.mk{background:var(--tint);border-radius:10px;padding:6px;text-align:center}
.mk .ar{font-size:32px;line-height:1.4}
.mk b{display:block;font-size:13px}
.mk small{font-size:11.5px;display:block}
.wl{display:flex;flex-direction:column}
.wr{display:grid;grid-template-columns:minmax(104px,40%) minmax(0,1fr);gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wr:first-child{border-top:0}
.wr .w-ar{font-size:32px;line-height:1.45;text-align:center}
.wr.ph{grid-template-columns:1fr}
.wr.ph .w-ar{font-size:30px;text-align:right}
.w-i{min-width:0;display:flex;flex-direction:column;gap:4px}
.w-i .row{gap:6px}
.wr.locked .w-ar{opacity:.45}
.need{font-size:12px;color:var(--mute)}
.rootbig{font-size:52px;line-height:1.3;letter-spacing:.25em;color:var(--root);text-align:center}
.patbig{font-size:46px;line-height:1.4;text-align:center}
.sticky-cta{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.sticky-cta .btn.primary{box-shadow:0 6px 20px rgba(0,0,0,.18)}

/* letters + roots tabs */
.ltiles{display:flex;flex-wrap:wrap;gap:8px;direction:rtl}
.lt{width:56px;height:62px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:32px/1 var(--f-ar);display:grid;place-items:center;position:relative}
.lt.off{opacity:.4}
.lt[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lt .au{position:absolute;top:3px;left:4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
details.rt-d{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.rt-d>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
details.rt-d>summary::-webkit-details-marker{display:none}
.r-ar{font-size:30px;line-height:1.3;letter-spacing:.2em;color:var(--root);min-width:84px;text-align:center}
.r-t{flex:1;min-width:0}
.r-t small{display:block}
.chev{flex:none;transition:transform .15s;color:var(--mute)}
details[open] .chev{transform:rotate(90deg)}
details.rt-d .wl{padding:0 14px 8px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pc{background:var(--tint);border-radius:10px;padding:8px 10px;text-align:center}
.pc .ar{font-size:30px;display:block;line-height:1.5}
.pc small{display:block;font-size:12px}
.pc .ex{font-size:20px;color:var(--ink)}

/* practice */
.drills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.dr{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dr b{font-weight:600}
.dr .ar{font-size:26px;line-height:1.3;color:var(--root)}
.dr:disabled{opacity:.5}
.dr.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dr.main small,.dr.main .ar{color:inherit;opacity:.85}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;align-items:center;gap:10px}
.qhead .x{border:0;background:none;font-size:24px;line-height:1;color:var(--mute);padding:4px 6px}
.qhead .bar{flex:1}
.combo{font:700 14px var(--f-display);color:var(--root);min-width:44px;text-align:right}
.combo.pop{animation:pop .35s}
.qlabel{font-weight:600;color:var(--mute);text-align:center}
.qbox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:110px;justify-content:center}
.q-letter{font-size:104px;line-height:1.25;color:var(--accent)}
.q-word{font-size:60px;line-height:1.45}
.q-phrase{font-size:38px;line-height:1.6}
.q-mean{font:600 22px/1.35 var(--f-body)}
.q-snd{font:700 34px var(--f-display);color:var(--accent)}
.q-root{font-size:34px;line-height:1.4}
.q-root .r{color:var(--root);letter-spacing:.25em}
.q-root .plus{font:600 22px var(--f-body);color:var(--mute);margin:0 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.one{grid-template-columns:1fr}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;min-height:58px;text-align:center;min-width:0;overflow-wrap:anywhere}
.opt .ar{font-size:34px;line-height:1.35}
.opt .ar.sm{font-size:26px}
.opt small{display:block;font-size:12px}
.opt.right{background:var(--good-tint);border-color:var(--good);animation:pop .3s}
.opt.wrong{background:var(--bad-tint);border-color:var(--bad);animation:shake .3s}
.built{min-height:72px;border-bottom:2px solid var(--line);font-size:48px;line-height:1.45;text-align:center;padding:0 8px}
.built.ok{border-color:var(--good);color:var(--good)}
.built.no{border-color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:52px;height:58px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font:32px/1 var(--f-ar)}
.tile.w{font-size:26px}
.tile:disabled{opacity:.25}
.fb{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.fb.right{background:var(--good-tint)}
.fb.wrong{background:var(--bad-tint)}
.fb .ar{font-size:30px;line-height:1.45}
.fb .row{gap:8px}
.score{font:700 46px var(--f-display);text-align:center;color:var(--accent)}
.unl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.unl>span{background:var(--root-tint);border-radius:10px;padding:2px 12px;font-size:28px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
#toast.on{opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* manage */
.ta{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ta.sm{min-height:60px}
label.btn{display:inline-block}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
.msg.ok{background:var(--good-tint)}
.msg.bad{background:var(--bad-tint)}
.msg ul{margin:4px 0 0;padding-left:18px}
.packrow,.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.packrow:first-child,.kv:first-child{border-top:0}
.packrow>div{flex:1;min-width:0}
.packrow b,.packrow small{display:block}
.kv span:last-child{text-align:right}
.mono{font:13px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}

@media (max-width:400px){.q-letter{font-size:88px}.q-word{font-size:50px}.q-phrase{font-size:32px}.big{font-size:54px}.lcard{grid-template-columns:70px minmax(0,1fr)}.tabs button{font-size:12.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
</style>
</head>
<body data-lang="both">
<div class="wrap">
  <header class="top">
    <div class="bar-row">
      <div class="brand"><span class="ar brand-ar" lang="ar">جذر</span><b>Jidr</b></div>
      <div class="lang" role="group" aria-label="Explanation language">
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="both" aria-pressed="true">EN+RU</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button type="button" data-tab="path"><span class="t-en">Path</span><span class="t-ru">Путь</span></button>
      <button type="button" data-tab="practice"><span class="t-en">Practice</span><span class="t-ru">Тренинг</span></button>
      <button type="button" data-tab="letters"><span class="t-en">Letters</span><span class="t-ru">Буквы</span></button>
      <button type="button" data-tab="roots"><span class="t-en">Roots</span><span class="t-ru">Корни</span></button>
      <button type="button" data-tab="manage"><span class="t-en">More</span><span class="t-ru">Ещё</span></button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="toast" role="status"></div>
<audio id="player" preload="none"></audio>
<script src="course.js"></script>
<script>
"use strict";
/* ================= basics ================= */
const C=window.COURSE;
const APP_VERSION="2.0.0",STATE_VER=2;
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bi=(en,ru)=>`<span class="l-en">${en}</span><span class="l-ru">${ru}</span>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uniq=a=>[...new Set(a)];
const ZWJ="‍";
const HAR=/[ً-ٰٟـ]/;
const PUNCT=/[\s؟،.!?,]/;
const SEAT={"أ":"اء","إ":"اء","آ":"اء","ؤ":"وء","ئ":"يء","ى":"ي"};
const BASE={"أ":"ا","إ":"ا","آ":"ا","ؤ":"و","ئ":"ي","ى":"ي"};
const skel=s=>[...s].filter(c=>!HAR.test(c)).join("");
const nrm=s=>[...skel(s)].map(c=>BASE[c]||c).join("");
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function clusters(ar){const out=[];for(const ch of ar){if(HAR.test(ch)&&out.length)out[out.length-1]+=ch;else out.push(ch)}return out}

/* ================= letters ================= */
const LET=C.letters.map(a=>({c:a[0],n:a[1],tr:a[2],en:a[3],ru:a[4],dots:C.dots[a[5]],conn:!!a[6],fam:a[7],say:a[8],key:"L:"+a[0]}));
const byC={};LET.forEach(l=>byC[l.c]=l);
C.sounds.forEach((g,i)=>{for(const c of g.L)if(byC[c])byC[c].sg=i});
function reqLetters(ar){const o=new Set();for(const ch of ar){if(HAR.test(ch)||PUNCT.test(ch))continue;for(const c of (SEAT[ch]||ch))if(byC[c])o.add(c)}return [...o]}
function forms(l){
  if(l.c==="ء")return [["alone","отдельно",l.c]];
  if(l.c==="ة")return [["alone","отдельно",l.c],["end","в конце",ZWJ+l.c]];
  if(l.conn)return [["alone","отдельно",l.c],["start","в начале",l.c+ZWJ],["middle","в середине",ZWJ+l.c+ZWJ],["end","в конце",ZWJ+l.c]];
  return [["alone","отдельно",l.c],["end","в конце",ZWJ+l.c]];
}

/* ================= saved data (lives on this phone) =================
   localStorage "jidr-state": progress + settings. "jidr-packs": lessons added in the app.
   Recordings loaded from a file live in IndexedDB. Code updates never touch any of these.
   If the saved shape changes, bump STATE_VER and upgrade inside migrate(). */
const DEF={ver:STATE_VER,done:[],srs:{},lang:"both",tab:"path",xp:0,streak:0,lastDay:0,tr:"off",auto:true,letView:"shape",lastBackup:0};
let S=Object.assign({},DEF,{done:[],srs:{}});
let PACKS=[],storageOK=true;
function migrate(s){
  s=Object.assign({},DEF,{done:[],srs:{}},s||{});
  if(!s.ver||s.ver<2){ /* v1 tracked letter groups of the old layout; the path is new, so it starts fresh */
    s.done=[];s.srs={};if(s.tab&&!["path","practice","letters","roots","manage"].includes(s.tab))s.tab="path";delete s.learned;delete s.best;s.ver=2;
  }
  if(!Array.isArray(s.done))s.done=[];
  if(!s.srs||typeof s.srs!=="object")s.srs={};
  if(!["en","ru","both"].includes(s.lang))s.lang="both";
  if(!["off","tap"].includes(s.tr))s.tr="off";
  return s;
}
try{const raw=localStorage.getItem("jidr-state");if(raw)S=migrate(JSON.parse(raw))}catch(e){}
try{localStorage.setItem("jidr-probe","1");localStorage.removeItem("jidr-probe")}catch(e){storageOK=false}
const save=()=>{try{localStorage.setItem("jidr-state",JSON.stringify(S))}catch(e){storageOK=false}};
const savePacks=a=>{try{localStorage.setItem("jidr-packs",JSON.stringify(a));return true}catch(e){return false}};

/* ================= content model ================= */
let STEPS=[],WORDS=[],PHRASES=[],ITEMS={},ROOTM={};
function buildData(){
  ROOTM=Object.assign({},C.roots);
  STEPS=C.steps.map(s=>Object.assign({},s));
  PACKS.forEach(p=>{
    Object.keys(p.roots||{}).forEach(r=>{if(!ROOTM[r])ROOTM[r]=p.roots[r]});
    p.steps.forEach((s,i)=>STEPS.push(Object.assign({},s,{id:p.id+":"+i,kind:s.root?"root":"theme",pack:p.id})));
  });
  WORDS=[];PHRASES=[];ITEMS={};
  LET.forEach(l=>{l.step=null;ITEMS[l.key]=l;l.type="L"});
  STEPS.forEach((st,si)=>{
    st.si=si;st.letters=st.L?[...st.L].map(c=>byC[c]).filter(Boolean):[];
    st.letters.forEach(l=>{l.step=st});
    st.W=(st.words||[]).map(w=>({type:"W",key:"W:"+w[0],ar:w[0],tr:w[1],en:w[2],ru:w[3],root:w[4]||"",pat:C.pats[w[5]]?w[5]:"",step:st,need:reqLetters(w[0])}));
    st.P=(st.phrases||[]).map(p=>({type:"P",key:"P:"+p[0],ar:p[0],tr:p[1],en:p[2],ru:p[3],step:st,need:reqLetters(p[0]),parts:p[0].split(/\s+/).filter(Boolean)}));
    st.W.forEach(w=>{WORDS.push(w);ITEMS[w.key]=w});
    st.P.forEach(p=>{PHRASES.push(p);ITEMS[p.key]=p});
  });
}
const isDone=st=>S.done.includes(st.id);
const learned=it=>it.step?isDone(it.step):false;
const knownLetters=()=>LET.filter(learned);
const knownSet=()=>new Set(knownLetters().map(l=>l.c));
const readable=(it,ks)=>it.need.every(c=>ks.has(c));
const curIndex=()=>{const i=STEPS.findIndex(s=>!isDone(s));return i<0?STEPS.length:i};
const isOpen=st=>isDone(st)||st.si<=curIndex();

/* highlight root letters (amber) inside a vocalised word */
function hl(ar,root){
  if(!root)return esc(ar);
  const rl=[...nrm(root)];let i=0,h="";
  for(const c of clusters(ar)){if(i<rl.length&&nrm(c)===rl[i]){h+=`<span class="rt">${c}</span>`;i++}else h+=esc(c)}
  return h;
}
const patT=code=>{const t=C.pats[code].t;return clusters(t).map(c=>/^[فعل]/.test(c)?`<span class="rt">${c}</span>`:c).join("")};
const spaced=r=>[...r].join(" ");

/* ================= audio ================= */
const AUD={};const player=$("#player");let playingBtn=null;
const SPK=`<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const hasA=k=>!!AUD[k];
const spk=(k,big)=>hasA(k)?`<button type="button" class="spk${big?" big":""}" data-play="${esc(k)}" aria-label="Play">${SPK}</button>`:"";
function addClips(o,src){
  if(!o||o.app!=="jidr-audio"||!o.clips||typeof o.clips!=="object")return -1;
  let n=0;
  Object.keys(o.clips).forEach(k=>{const c=o.clips[k];
    if(/^[LWP]:/.test(k)&&c&&typeof c.m==="string"&&/^audio\//.test(c.m)&&typeof c.d==="string"&&c.d.length<3e6&&/^[A-Za-z0-9+/=]+$/.test(c.d.slice(0,200))){
      if(AUD[k]&&AUD[k].url)URL.revokeObjectURL(AUD[k].url);AUD[k]={m:c.m,d:c.d,src};n++}});
  return n;
}
function play(k,btn){
  const a=AUD[k];if(!a)return;
  try{
    if(!a.url){const bin=atob(a.d),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);a.url=URL.createObjectURL(new Blob([u],{type:a.m}))}
    if(playingBtn)playingBtn.classList.remove("playing");
    playingBtn=btn||null;if(btn)btn.classList.add("playing");
    player.src=a.url;const p=player.play();if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}
player.addEventListener("ended",()=>{if(playingBtn)playingBtn.classList.remove("playing");playingBtn=null});
function idb(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error("no idb"));const r=indexedDB.open("jidr",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbOp(mode,fn){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction("kv",mode),st=t.objectStore("kv"),r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
const idbGet=k=>idbOp("readonly",s=>s.get(k));
const idbSet=(k,v)=>idbOp("readwrite",s=>s.put(v,k));
const idbDel=k=>idbOp("readwrite",s=>s.delete(k));
async function loadAudio(){
  Object.keys(AUD).forEach(k=>{if(AUD[k].url)URL.revokeObjectURL(AUD[k].url);delete AUD[k]});
  try{const r=await fetch("jidr-audio.json",{cache:"no-cache"});if(r.ok)addClips(await r.json(),"host")}catch(e){}
  try{const loc=await idbGet("audio");if(loc)addClips(loc,"local")}catch(e){}
  if(!Q)render();else renderStats();
}
const audioCount=()=>Object.keys(AUD).filter(k=>ITEMS[k]).length;

/* ================= progress, XP, streak ================= */
const IV=[0,1,2,4,8,16,32];
function grade(key,ok){
  const r=S.srs[key]||{b:0,d:0,n:0,w:0};
  if(ok){r.b=Math.min(6,r.b+1);r.d=today()+IV[r.b]}else{r.b=Math.max(0,r.b-2);r.d=today();r.w=(r.w||0)+1}
  r.n=(r.n||0)+1;S.srs[key]=r;
}
function bumpStreak(){const d=today();if(S.lastDay===d)return;S.streak=S.lastDay===d-1?S.streak+1:1;S.lastDay=d}
const streakNow=()=>S.lastDay>=today()-1?S.streak:0;
const learnedItems=()=>[...knownLetters(),...WORDS.filter(learned),...PHRASES.filter(learned)];
const dueItems=()=>learnedItems().filter(it=>{const r=S.srs[it.key];return !r||r.d<=today()});
function markDone(st){
  if(!isDone(st))S.done.push(st.id);
  [...st.letters,...st.W,...st.P].forEach(it=>{if(!S.srs[it.key])S.srs[it.key]={b:1,d:today()+1,n:0,w:0}});
  save();
}

/* ================= header ================= */

function toast(html){const t=$("#toast");t.innerHTML=html;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1600)}
function confetti(){
  if(matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const box=document.createElement("div");box.className="confetti";
  const cols=["#0B5F66","#B4630A","#1F7A3F","#C2185B","#F0A04B","#5CC4C9"];
  for(let i=0;i<36;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"vw";p.style.background=pick(cols);p.style.animationDelay=Math.random()*.5+"s";p.style.transform=`rotate(${Math.random()*180}deg)`;box.appendChild(p)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2600);

/* ================= shared pieces ================= */
const trBtn=it=>S.tr==="tap"&&it.tr?`<button type="button" class="trv" data-tr="${esc(it.tr)}">Aa</button>`:"";
const patChip=w=>w.pat?`<span class="pchip ar" title="${esc(C.pats[w.pat].en)}">${patT(w.pat)}</span>`:"";

  return `<div class="wr${locked?" locked":""}"><div class="w-ar ar" lang="ar">${hl(w.ar,w.root)}</div>
  <div class="w-i"><div>${bi(esc(w.en),esc(w.ru))}</div><div class="row">${patChip(w)}${spk(w.key)}${trBtn(w)}${locked?`<span class="need">🔒 ${bi("step","шаг")} ${w.step.si+1}</span>`:""}</div></div></div>`;

function letterCard(l){
  const fam=LET.filter(x=>x.fam===l.fam),sg=l.sg!=null?C.sounds[l.sg]:null;
  return `<div class="lcard"><div class="big ar">${l.c}</div>

  ${sg?`<div class="alike"><small>${bi("Sounds like","Звучит похоже")}</small>${[...sg.L].map(c=>`<span class="ar${c===l.c?" me":""}">${c}</span>`).join("")}<small>${bi(sg.en,sg.ru)}</small></div>`:""}</div>`;

function vowelCard(){
  const m=[["بَ","ba","fatḥa","а"],["بِ","bi","kasra","и"],["بُ","bu","ḍamma","у"],["بْ","b","sukūn",bi("no vowel","без гласной")],["بّ","bb","shadda",bi("doubled","удвоение")],["بً","ban","tanwīn",bi("-an ending","окончание -ан")]];

  <div class="marks">${m.map(x=>`<div class="mk"><span class="ar">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small><small>${x[3]}</small></div>`).join("")}</div></section>`;
}
const stepPreview=st=>st.L?spaced(st.L):st.root?spaced(st.root):st.pat?C.pats[st.pat].t:(st.P[0]||st.W[0]||{ar:""}).ar;
const kindLabel=st=>({letters:bi("New letters","Новые буквы"),root:bi("Root","Корень"),pattern:bi("Pattern","Шаблон"),grammar:bi("Grammar","Грамматика"),theme:bi("Words","Слова")})[st.kind]||"";
const counts=st=>[st.letters.length?`${st.letters.length} ${bi("letters","букв")}`:"",st.W.length?`+${st.W.length} ${bi("words","слов")}`:"",st.P.length?`+${st.P.length} ${bi("phrases","фраз")}`:""].filter(Boolean).join(" · ");

/* ================= Path tab ================= */

function renderPath(){

  h+=`<section class="card"><div class="kpis">
   <div class="kpi"><b>${ks.size}<small>/${LET.length}</small></b><small>${bi("letters","букв")}</small></div>

     <span class="st-t"><b>${bi(esc(st.t[0]),esc(st.t[1]))}</b><small>${kindLabel(st)} · ${counts(st)}</small></span>

function renderStep(){
  const st=STEPS.find(s=>s.id===UI.step);if(!st){UI.step=null;return renderPath()}
  const done=isDone(st);
  let h=`<button type="button" class="back" data-back>← ${bi("Path","Путь")}</button>

   <h2 style="font-size:19px">${bi(esc(st.t[0]),esc(st.t[1]))}</h2>
   ${st.en?`<p class="lead bl">${bi(esc(st.en),esc(st.ru))}</p>`:""}</section>`;
  if(st.si===0)h+=vowelCard();
  if(st.letters.length)h+=`<section class="card"><h2>${bi("Letters","Буквы")}</h2>${st.letters.map(letterCard).join("")}</section>`;
  if(st.root&&st.kind!=="grammar")h+=`<section class="card"><div class="rootbig ar">${spaced(st.root)}</div><p style="text-align:center">${ROOTM[st.root]?bi(esc(ROOTM[st.root][0]),esc(ROOTM[st.root][1])):""}</p></section>`;
  if(st.pat)h+=`<section class="card"><div class="patbig ar">${patT(st.pat)}</div><p style="text-align:center">${bi(esc(C.pats[st.pat].en),esc(C.pats[st.pat].ru))}</p></section>`;

/* ================= question generators =================
   Each takes an item and returns a question or null when it does not fit.
   choice: {opts:[{k,html}],ans}   tiles: {tiles:[str],target:str,join,mode}            */
const LBL={
  findL:["Find the letter","Найдите букву"], whatS:["Which sound?","Какой звук?"], hear:["Which one do you hear?","Что вы слышите?"],
  descr:["Which letter fits this sound?","Какая буква так звучит?"], hit:["Which letter is pink?","Какая буква выделена?"],
  mean:["What does it mean?","Что это значит?"], findW:["Find the word","Найдите слово"], listenW:["What did you hear?","Что прозвучало?"],
  spell:["Build the word","Соберите слово"], root:["Tap the root letters in order","Нажмите корневые буквы по порядку"],
  make:["Root + pattern = ?","Корень + шаблон = ?"], pat:["Which pattern?","Какой шаблон?"],
  order:["Put the words in order","Расставьте слова по порядку"], gap:["Fill the gap","Заполните пропуск"]
};
const pool={}; /* filled per quiz: letters, words, phrases the learner may see */
function lookAlikes(l,n,within){
  const L=within||pool.L;const same=shuffle(L.filter(x=>x!==l&&x.fam===l.fam)),snd=shuffle(L.filter(x=>x!==l&&x.sg!=null&&x.sg===l.sg&&x.fam!==l.fam));
  const rest=shuffle(L.filter(x=>x!==l&&!same.includes(x)&&!snd.includes(x)));
  return uniq(same.concat(snd,rest)).slice(0,n);
}
const bigAr=(ar,cls)=>`<div class="ar ${cls}" lang="ar">${ar}</div>`;
const meanHtml=it=>`<div class="q-mean">${bi(esc(it.en),esc(it.ru))}</div>`;
function gL_pick(l){
  const ds=lookAlikes(l,3);if(ds.length<1)return null;
  const prompt=hasA(l.key)?spk(l.key,true):`<div class="q-snd">${esc(l.tr)}</div><small>${l.n}</small>`;
  return {kind:"choice",item:l,label:LBL.findL,prompt,audio:hasA(l.key)?l.key:null,opts:shuffle([l,...ds]).map(x=>({k:x.c,html:`<span class="ar">${x.c}</span>`})),ans:l.c};
}
function gL_name(l){
  const ds=lookAlikes(l,3);if(ds.length<1)return null;
  return {kind:"choice",item:l,label:LBL.whatS,prompt:bigAr(l.c,"q-letter"),opts:shuffle([l,...ds]).map(x=>({k:x.c,html:`<b>${esc(x.tr)}</b><small>${x.n}</small>`})),ans:l.c};
}
function gL_sound(l){
  if(l.sg==null)return null;
  const grp=pool.L.filter(x=>x.sg===l.sg);if(grp.length<2)return null;
  const extra=lookAlikes(l,4).filter(x=>!grp.includes(x)).slice(0,Math.max(0,3-(grp.length-1)));
  const sg=C.sounds[l.sg],a=hasA(l.key);
  const prompt=a?spk(l.key,true):`<div class="q-snd">${esc(l.tr)}</div><p class="bl" style="max-width:34ch">${bi(esc(l.en),esc(l.ru))}</p>`;
  return {kind:"choice",item:l,label:a?LBL.hear:LBL.descr,prompt,audio:a?l.key:null,opts:shuffle(grp.concat(extra)).map(x=>({k:x.c,html:`<span class="ar">${x.c}</span>`})),ans:l.c,after:`<small>${bi(esc(sg.en),esc(sg.ru))}</small>`};
}
function gL_inword(l){
  if(l.c==="ء")return null;
  const ws=shuffle(pool.W.filter(w=>skel(w.ar).length>=3&&skel(w.ar).includes(l.c)));if(!ws.length)return null;
  const w=ws[0],cl=clusters(w.ar),idx=cl.map((c,i)=>c[0]===l.c?i:-1).filter(i=>i>=0);const at=pick(idx);
  const html=cl.map((c,i)=>i===at?`<span class="hit">${c}</span>`:esc(c)).join("");
  const ds=lookAlikes(l,3);if(!ds.length)return null;
  return {kind:"choice",item:l,label:LBL.hit,prompt:bigAr(html,"q-word"),opts:shuffle([l,...ds]).map(x=>({k:x.c,html:`<span class="ar">${x.c}</span>`})),ans:l.c,showItem:w};
}
function similarWords(w,n){
  const sk=nrm(w.ar);
  return shuffle(pool.W.filter(x=>x!==w&&nrm(x.ar)!==sk)).map(x=>{const xs=nrm(x.ar);let s=0;for(const c of new Set(xs))if(sk.includes(c))s++;if(x.root&&x.root===w.root)s+=3;s-=Math.abs(xs.length-sk.length)*.5;return [s+Math.random(),x]}).sort((a,b)=>b[0]-a[0]).slice(0,n).map(a=>a[1]);
}
function gW_mean(w){
  const ds=shuffle(pool.W.filter(x=>x!==w&&x.en!==w.en)).sort((a,b)=>(b.step===w.step)-(a.step===w.step)).slice(0,3);if(ds.length<2)return null;
  return {kind:"choice",item:w,label:LBL.mean,prompt:bigAr(esc(w.ar),"q-word"),opts:shuffle([w,...ds]).map(x=>({k:x.key,html:bi(esc(x.en),esc(x.ru))})),ans:w.key,one:true};
}
function gW_pick(w){
  const ds=similarWords(w,3);if(ds.length<2)return null;
  return {kind:"choice",item:w,label:LBL.findW,prompt:meanHtml(w),opts:shuffle([w,...ds]).map(x=>({k:x.key,html:`<span class="ar">${esc(x.ar)}</span>`})),ans:w.key};
}
function gW_listen(w){
  if(!hasA(w.key))return null;const ds=similarWords(w,3);if(ds.length<2)return null;
  return {kind:"choice",item:w,label:LBL.listenW,prompt:spk(w.key,true),audio:w.key,opts:shuffle([w,...ds]).map(x=>({k:x.key,html:`<span class="ar">${esc(x.ar)}</span>`})),ans:w.key};
}
function gW_spell(w){
  const s=skel(w.ar);if(/\s/.test(s)||s.length<2||s.length>7)return null;
  const own=[...s],extra=[];
  shuffle(own).forEach(c=>{if(extra.length<2&&byC[BASE[c]||c]){const d=lookAlikes(byC[BASE[c]||c],2,LET).map(x=>x.c).find(x=>!own.includes(x)&&!extra.includes(x));if(d)extra.push(d)}});
  return {kind:"tiles",mode:"spell",item:w,label:LBL.spell,prompt:meanHtml(w)+spk(w.key),tiles:shuffle(own.concat(extra)),target:s,join:"",need:own.length};
}
function rootInWord(w){
  if(!w.root)return false;const r=[...nrm(w.root)],s=nrm(w.ar);let i=0;for(const c of s)if(c===r[i])i++;
  return i===r.length&&new Set(r).size===r.length&&s.length>r.length;
}
function gW_root(w){
  if(!rootInWord(w))return null;
  return {kind:"tiles",mode:"root",item:w,label:LBL.root,prompt:bigAr(esc(w.ar),"q-word")+`<small>${bi(esc(w.en),esc(w.ru))}</small>`,tiles:[...skel(w.ar)],target:nrm(w.root),join:"",need:[...w.root].length,keep:true};
}
function gW_make(w){
  if(!w.root||!w.pat)return null;
  const fam=pool.W.filter(x=>x.root===w.root&&x!==w&&nrm(x.ar)!==nrm(w.ar));if(fam.length<2)return null;
  const prompt=`<div class="q-root ar"><span class="r">${spaced(w.root)}</span><span class="plus">+</span>${patT(w.pat)}</div>`;
  return {kind:"choice",item:w,label:LBL.make,prompt,opts:shuffle([w,...shuffle(fam).slice(0,3)]).map(x=>({k:x.key,html:`<span class="ar">${esc(x.ar)}</span>`})),ans:w.key};
}
function gW_pat(w){
  if(!w.pat)return null;
  const others=shuffle(Object.keys(C.pats).filter(k=>k!==w.pat&&C.pats[k].t!==C.pats[w.pat].t)).slice(0,3);
  return {kind:"choice",item:w,label:LBL.pat,prompt:bigAr(hl(w.ar,w.root),"q-word"),opts:shuffle([w.pat,...others]).map(k=>({k,html:`<span class="ar sm">${patT(k)}</span><small>${bi(esc(C.pats[k].en),esc(C.pats[k].ru))}</small>`})),ans:w.pat};
}
function gP_mean(p){
  const ds=shuffle(pool.P.filter(x=>x!==p&&x.en!==p.en)).slice(0,3);if(ds.length<1)return null;
  return {kind:"choice",item:p,label:LBL.mean,prompt:bigAr(esc(p.ar),"q-phrase"),opts:shuffle([p,...ds]).map(x=>({k:x.key,html:bi(esc(x.en),esc(x.ru))})),ans:p.key,one:true};
}
function gP_order(p){
  if(p.parts.length<2)return null;
  const tiles=p.parts.slice();
  if(p.parts.length>=2){const d=shuffle(pool.W.map(w=>w.ar).filter(a=>!p.parts.includes(a)))[0];if(d)tiles.push(d)}
  return {kind:"tiles",mode:"order",item:p,label:LBL.order,prompt:meanHtml(p)+spk(p.key),tiles:shuffle(tiles),target:p.parts.join(" "),join:" ",need:p.parts.length,words:true};
}
function gP_gap(p){
  if(p.parts.length<2)return null;
  const gi=Math.floor(Math.random()*p.parts.length),gw=p.parts[gi];
  const ds=shuffle(uniq(pool.W.map(w=>w.ar).concat(pool.P.flatMap(x=>x.parts))).filter(a=>nrm(a)!==nrm(gw))).slice(0,3);if(ds.length<2)return null;
  const html=p.parts.map((w,i)=>i===gi?`<span class="hit">＿＿</span>`:esc(w)).join(" ");
  return {kind:"choice",item:p,label:LBL.gap,prompt:bigAr(html,"q-phrase")+`<small>${bi(esc(p.en),esc(p.ru))}</small>`,opts:shuffle([gw,...ds]).map(a=>({k:a,html:`<span class="ar sm">${esc(a)}</span>`})),ans:gw};
}
const TIERS={L:[[gL_name,gL_pick],[gL_pick,gL_sound,gL_inword],[gL_inword,gL_sound,gL_pick]],
  W:[[gW_mean,gW_pick],[gW_pick,gW_listen,gW_pat,gW_root],[gW_spell,gW_root,gW_make,gW_listen,gW_pick]],
  P:[[gP_mean,gP_order],[gP_order,gP_gap],[gP_order,gP_gap]]};
function genFor(it,tier){
  for(let t=tier;t>=0;t--){for(const g of shuffle(TIERS[it.type][t])){const q=g(it);if(q)return q}}
  return null;
}
const tierOf=it=>{const b=(S.srs[it.key]||{b:0}).b;return b<=1?0:b<=3?1:2};
function setPool(extra){
  const ks=knownSet();
  pool.L=uniq(knownLetters().concat(extra&&extra.letters||[]));
  pool.W=uniq(WORDS.filter(learned).concat(extra&&extra.W||[]));
  pool.P=uniq(PHRASES.filter(learned).concat(extra&&extra.P||[]));
  /* words the learner can already read help as distractors too */
  if(pool.W.length<8)pool.W=uniq(pool.W.concat(WORDS.filter(w=>readable(w,new Set([...ks,...pool.L.map(l=>l.c)])))));
}

/* ================= quiz engine ================= */
let Q=null;
function buildStepQuiz(st){
  setPool(st);
  const out=[];
  st.letters.forEach(l=>{const a=genFor(l,0);if(a)out.push(a);const b=pick([gL_inword,gL_sound,gL_pick])(l)||gL_pick(l);if(b)out.push(b)});
  const ws=shuffle(st.W).slice(0,Math.max(4,14-out.length-st.P.length));
  ws.forEach((w,i)=>{const gens=st.kind==="root"||st.kind==="pattern"?[gW_root,gW_make,gW_pat,gW_mean,gW_pick]:[gW_mean,gW_pick,gW_spell];const q=(i<2?gW_mean(w):null)||shuffle(gens).map(g=>g(w)).find(Boolean)||genFor(w,0);if(q)out.push(q)});
  st.P.forEach(p=>{const q=gP_order(p)||gP_mean(p);if(q)out.push(q)});
  return out.slice(0,16);
}
function buildReview(){
  setPool();
  const all=learnedItems(),d=today();
  const pr=all.map(it=>{const r=S.srs[it.key]||{b:0,d:0};return [(r.d<=d?0:100)+r.b*3+(r.d-d)+Math.random()*2-(r.w||0)*.3,it]}).sort((a,b)=>a[0]-b[0]).slice(0,12).map(a=>a[1]);
  return shuffle(pr).map(it=>genFor(it,tierOf(it))).filter(Boolean);
}
const DRILLS={
  review:{t:["Daily review","Ежедневный повтор"],ok:()=>learnedItems().length>=4,build:buildReview},
  alike:{t:["Look-alike letters","Похожие буквы"],ok:()=>{setPool();return pool.L.length>=3},build:()=>{setPool();return shuffle(pool.L).concat(shuffle(pool.L)).slice(0,12).map(l=>pick([gL_pick,gL_inword,gL_name])(l)||gL_pick(l)).filter(Boolean)}},
  sound:{t:["Sound twins","Звуковые близнецы"],ok:()=>{setPool();return pool.L.some(l=>gL_sound(l))},build:()=>{setPool();const c=pool.L.filter(l=>gL_sound(l));return shuffle(c.concat(c)).slice(0,12).map(gL_sound).filter(Boolean)}},
  spell:{t:["Build words","Собери слово"],ok:()=>{setPool();return WORDS.filter(learned).filter(w=>gW_spell(w)).length>=3},build:()=>{setPool();return shuffle(pool.W.filter(learned)).map(gW_spell).filter(Boolean).slice(0,10)}},
  roots:{t:["Roots and patterns","Корни и шаблоны"],ok:()=>{setPool();return WORDS.filter(learned).filter(w=>gW_root(w)||gW_pat(w)).length>=3},build:()=>{setPool();return shuffle(pool.W.filter(learned)).map(w=>shuffle([gW_root,gW_make,gW_pat]).map(g=>g(w)).find(Boolean)).filter(Boolean).slice(0,10)}},
  phrases:{t:["Phrases","Фразы"],ok:()=>PHRASES.filter(learned).length>=2,build:()=>{setPool();return shuffle(pool.P).concat(shuffle(pool.P)).slice(0,8).map(p=>pick([gP_order,gP_gap,gP_mean])(p)||gP_order(p)||gP_mean(p)).filter(Boolean)}},
  listen:{t:["Listening","Аудирование"],ok:()=>{setPool();return pool.W.filter(w=>hasA(w.key)).length+pool.L.filter(l=>hasA(l.key)).length>=4},build:()=>{setPool();return shuffle(pool.W.filter(w=>hasA(w.key)).map(gW_listen).concat(pool.L.filter(l=>hasA(l.key)).map(l=>gL_sound(l)||gL_pick(l)))).filter(Boolean).slice(0,12)}}
};
function startQuiz(qs,meta){
  if(!qs.length){toast(bi("Nothing to drill yet","Пока нечего тренировать"));return}
  Q=Object.assign({qs,i:0,ok:0,combo:0,best:0,xp:0,picked:[],answered:false,wrong:[]},meta);
  history.pushState({q:1},"");render();window.scrollTo(0,0);
}
function cur(){return Q&&Q.qs[Q.i]}
function renderQuiz(){
  if(Q.i>=Q.qs.length)return renderEnd();
  const q=cur(),pct=Math.round(Q.i/Q.qs.length*100);
  let h=`<section class="quiz"><div class="qhead"><button type="button" class="x" data-quit aria-label="Stop">×</button><div class="bar"><i style="width:${pct}%"></i></div><span class="combo" id="combo">${Q.combo>=2?"🔥 "+Q.combo:""}</span></div>
  <p class="qlabel">${bi(q.label[0],q.label[1])}</p><div class="qbox">${q.prompt}</div>`;
  if(q.kind==="choice")h+=`<div class="opts${q.one?" one":""}">${q.opts.map(o=>`<button type="button" class="opt" data-opt="${esc(o.k)}">${o.html}</button>`).join("")}</div>`;
  else h+=`<div class="built ar" id="built" lang="ar"></div><div class="tiles" dir="rtl">${q.tiles.map((t,i)=>`<button type="button" class="tile${q.words?" w":""}" data-tile="${i}">${esc(t)}</button>`).join("")}</div>
   <div class="row" style="justify-content:center"><button type="button" class="btn" data-undo>⌫ ${bi("Undo","Назад")}</button><button type="button" class="btn primary" data-check disabled>${bi("Check","Проверить")}</button></div>`;
  h+=`<div id="fb"></div><button type="button" class="btn primary big" data-next hidden>${bi("Next","Дальше")}</button></section>`;
  return h;
}
function afterQuiz(){
  const q=cur();
  if(q.audio)setTimeout(()=>play(q.audio,$(".qbox .spk")),250);
}
function itemReveal(it){
  if(!it)return "";
  if(it.type==="L")return `<div class="row"><span class="ar" style="font-size:40px">${it.c}</span><b>${it.n}</b><span class="tr">${esc(it.tr)}</span>${spk(it.key)}</div>`;
  return `<div class="row"><span class="ar">${hl(it.ar,it.root)}</span>${spk(it.key)}${trBtn(it)}</div><div>${bi(esc(it.en),esc(it.ru))}</div>`;
}
function answer(ok,shownAns){
  const q=cur();Q.answered=true;grade(q.item.key,ok);
  if(ok){Q.ok++;Q.combo++;Q.best=Math.max(Q.best,Q.combo);const g=10+Math.min(Q.combo,10)*2;Q.xp+=g;S.xp+=g;
    if(Q.combo===5||Q.combo===10||Q.combo===20)toast(`🔥 ${Q.combo} ${bi("in a row!","подряд!")}`)}
  else{Q.combo=0;Q.wrong.push(q.item)}
  save();
  const fb=$("#fb");
  fb.className="fb "+(ok?"right":"wrong");
  fb.innerHTML=(ok?`<b>${pick([bi("Yes!","Да!"),bi("Right!","Верно!"),bi("Nice!","Отлично!"),bi("Exactly.","Точно.")])}</b>`:`<b>${bi("Not quite.","Не совсем.")}</b>${shownAns||""}`)+(q.after||"")+itemReveal(q.showItem||q.item)+(q.showItem?itemReveal(q.item):"");
  const c=$("#combo");if(c){c.textContent=Q.combo>=2?"🔥 "+Q.combo:"";if(ok&&Q.combo>=2){c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop")}}
  const it=q.item;if(ok&&it.type!=="L"&&hasA(it.key)&&!q.audio)play(it.key,$("#fb .spk"));
  const nx=$("[data-next]");nx.hidden=false;
  if(ok&&S.auto&&q.kind==="choice"){const i=Q.i;setTimeout(()=>{if(Q&&Q.i===i&&Q.answered)next()},hasA(it.key)&&it.type!=="L"?1900:1100)}
  else nx.focus({preventScroll:true});
  renderStats();
}
function next(){if(!Q)return;Q.i++;Q.picked=[];Q.answered=false;render();window.scrollTo(0,0);if(Q.i<Q.qs.length)afterQuiz()}
function pickOpt(btn){
  const q=cur();if(Q.answered)return;
  const ok=btn.dataset.opt===String(q.ans);
  $$(".opt").forEach(b=>{b.disabled=true;if(b.dataset.opt===String(q.ans))b.classList.add("right")});
  if(!ok)btn.classList.add("wrong");
  answer(ok);
}
function tileTap(btn){
  const q=cur();if(Q.answered)return;
  Q.picked.push(+btn.dataset.tile);btn.disabled=true;updBuilt();
  if(Q.picked.length===q.need)check();
}
function builtStr(){const q=cur();return Q.picked.map(i=>q.tiles[i]).join(q.join)}
function updBuilt(){const q=cur(),b=$("#built");b.textContent=q.mode==="root"?Q.picked.map(i=>q.tiles[i]).join(" "):builtStr();const c=$("[data-check]");if(c)c.disabled=!Q.picked.length}
function undo(){if(Q.answered||!Q.picked.length)return;const i=Q.picked.pop();const b=$(`[data-tile="${i}"]`);if(b)b.disabled=false;updBuilt()}
function check(){
  const q=cur();if(Q.answered)return;
  const got=q.mode==="root"?nrm(Q.picked.map(i=>q.tiles[i]).join("")):builtStr();
  const ok=got===q.target;
  $("#built").classList.add(ok?"ok":"no");$$(".tile").forEach(b=>b.disabled=true);$("[data-check]").disabled=true;
  const show=q.mode==="root"?`<div class="ar rootbig" style="font-size:34px">${spaced(q.item.root)}</div>`:`<div class="ar">${esc(q.mode==="spell"?q.item.ar:q.target)}</div>`;
  answer(ok,ok?"":show);
}
function renderEnd(){
  const n=Q.qs.length,pc=Math.round(Q.ok/n*100);
  let h=`<section class="card quiz"><div class="score">${Q.ok}/${n}</div>
  <div class="kpis"><div class="kpi"><b>+${Q.xp}</b><small>XP</small></div><div class="kpi"><b>🔥 ${Q.best}</b><small>${bi("best combo","лучшая серия")}</small></div><div class="kpi"><b>${streakNow()}</b><small>${bi("day streak","дней подряд")}</small></div></div>`;
  if(Q.step){
    const st=STEPS.find(s=>s.id===Q.step),ks=knownSet(),rd=WORDS.filter(w=>readable(w,ks)).length;
    h+=`<h2 style="text-align:center">${pc>=60?bi("Step complete!","Шаг пройден!"):bi("Step saved. Repeat it soon.","Шаг засчитан. Повторите его скоро.")}</h2>`;
    if(st.letters.length)h+=`<div class="unl ar">${st.letters.map(l=>`<span>${l.c}</span>`).join("")}</div>`;
    h+=`<div class="unl">${st.W.slice(0,12).map(w=>`<span class="ar">${hl(w.ar,w.root)}</span>`).join("")}</div>
    <p style="text-align:center">${bi(`Unlocked: ${st.W.length} words, ${st.P.length} phrases. You can now read <b>${rd}</b> words.`,`Открыто: слов — ${st.W.length}, фраз — ${st.P.length}. Теперь вы читаете <b>${rd}</b> слов.`)}</p>`;
    const nx=STEPS[curIndex()];
    h+=nx?`<button type="button" class="btn primary big" data-step="${nx.id}" data-endq>${bi("Next step","Следующий шаг")}: ${bi(esc(nx.t[0]),esc(nx.t[1]))}</button>`:"";
  }
  if(Q.wrong.length){const ws=uniq(Q.wrong).slice(0,8);h+=`<p class="qlabel">${bi("Worth another look","Стоит повторить")}</p><div class="unl">${ws.map(it=>`<span class="ar">${esc(it.c||it.ar)}</span>`).join("")}</div>
   <button type="button" class="btn" data-again>${bi("Drill these again","Ещё раз эти")}</button>`}
  h+=`<button type="button" class="btn${Q.step?"":" primary big"}" data-endq>${bi("Done","Готово")}</button></section>`;
  return h;
}
function finishQuiz(){
  if(Q.finished)return;Q.finished=true;
  bumpStreak();
  if(Q.step){const st=STEPS.find(s=>s.id===Q.step);if(st)markDone(st)}

/* Lesson pack: {id, title, roots?:{"ركب":["ride","ехать"]}, steps:[{t:[en,ru], en?, ru?, root?, words:[[ar,tr,en,ru,root,pat]], phrases:[[ar,tr,en,ru]]}]} */
const ARABIC_ONLY=/^[؀-ۿ\s]+$/;
function strWalk(v,path,errs){
  if(typeof v==="string"){if(/[<>]/.test(v))errs.push(path+': text contains "<" or ">"');else if(v.length>400)errs.push(path+": text is too long")}
  else if(Array.isArray(v))v.forEach((x,i)=>strWalk(x,path+"["+i+"]",errs));
  else if(v&&typeof v==="object")Object.keys(v).forEach(k=>strWalk(v[k],path+"."+k,errs));
}
function convertV1(raw){ /* packs from app version 1 grouped words by root */
  const steps=[],roots={};const codes={pl:"pl",dr:"dr",dn:"dn",mu:"mu"};
  (raw.roots||[]).forEach(r=>{if(!r||!Array.isArray(r.w))return;if(r.r)roots[r.r]=[String(r.en||""),String(r.ru||"")];
    steps.push({t:[(raw.units&&raw.units[r.u]&&raw.units[r.u][0])||String(r.en||"Words"),(raw.units&&raw.units[r.u]&&raw.units[r.u][1])||String(r.ru||"Слова")],root:r.r||"",
      words:r.w.map(w=>[w[0],w[1],w[2],w[3],r.r||"",codes[String(w[4]||"").split(" ")[0]]||""]),phrases:[]})});
  return {id:raw.id,title:raw.title||raw.id,roots,steps};
}
function validatePack(raw,others){
  if(!raw||typeof raw!=="object"||Array.isArray(raw))return{errs:["This is not a lesson pack (expected one JSON object)."]};
  if(!raw.steps&&Array.isArray(raw.roots))raw=convertV1(raw);
  const errs=[];strWalk(raw,"pack",errs);
  if(typeof raw.id!=="string"||!/^[a-z0-9][a-z0-9_-]{0,39}$/i.test(raw.id))errs.push('"id" must be a short name such as "food-2" (letters, numbers, - or _).');
  const roots={};
  if(raw.roots!=null){if(typeof raw.roots!=="object"||Array.isArray(raw.roots))errs.push('"roots" must look like {"ركب":["ride","ехать"]}.');
    else Object.keys(raw.roots).forEach(r=>{const m=raw.roots[r];if(!/^[ء-ي]{3,4}$/.test(r)||!Array.isArray(m)||typeof m[0]!=="string"||typeof m[1]!=="string")errs.push('Root "'+r+'" needs ["English","Русский"].');else roots[r]=[m[0],m[1]]})}
  const seen=new Set();C.steps.forEach(s=>{(s.words||[]).forEach(w=>seen.add("W:"+w[0]));(s.phrases||[]).forEach(p=>seen.add("P:"+p[0]))});
  others.forEach(o=>o.steps.forEach(s=>{s.words.forEach(w=>seen.add("W:"+w[0]));s.phrases.forEach(p=>seen.add("P:"+p[0]))}));
  const steps=[];
  if(!Array.isArray(raw.steps)||!raw.steps.length)errs.push('"steps" must be a list with at least one step.');
  else{
    if(raw.steps.length>30)errs.push("A pack can hold up to 30 steps.");
    raw.steps.forEach((s,i)=>{
      const at="steps["+i+"]";
      if(!s||typeof s!=="object"){errs.push(at+" is not an object.");return}
      if(!Array.isArray(s.t)||typeof s.t[0]!=="string"||typeof s.t[1]!=="string"||!s.t[0]||!s.t[1])errs.push(at+': "t" must be ["English title","Русское название"].');
      const root=typeof s.root==="string"?s.root:"";
      if(root&&!/^[ء-ي]{3,4}$/.test(root))errs.push(at+': root "'+root+'" must be 3 or 4 Arabic letters without vowel marks.');
      const words=[],phrases=[];
      (Array.isArray(s.words)?s.words:[]).forEach((w,j)=>{const wa=at+".words["+j+"]";
        if(!Array.isArray(w)||w.length<4||[0,1,2,3].some(k=>typeof w[k]!=="string"||!w[k])){errs.push(wa+": a word is [arabic, transliteration, English, Russian, root, pattern].");return}
        if(!ARABIC_ONLY.test(w[0])||/\s/.test(w[0].trim()))errs.push(wa+": the first item must be one Arabic word.");
        const wr=typeof w[4]==="string"?w[4]:"",wp=typeof w[5]==="string"?w[5]:"";
        if(wr&&!/^[ء-ي]{3,4}$/.test(wr))errs.push(wa+": root must be 3 or 4 Arabic letters.");
        if(wp&&!C.pats[wp])errs.push(wa+': unknown pattern code "'+wp+'".');
        if(seen.has("W:"+w[0]))errs.push(wa+": "+w[0]+" is already in the app.");seen.add("W:"+w[0]);
        words.push([w[0].trim(),w[1],w[2],w[3],wr,wp])});
      (Array.isArray(s.phrases)?s.phrases:[]).forEach((p,j)=>{const pa=at+".phrases["+j+"]";
        if(!Array.isArray(p)||p.length<4||[0,1,2,3].some(k=>typeof p[k]!=="string"||!p[k])){errs.push(pa+": a phrase is [arabic, transliteration, English, Russian].");return}
        if(!ARABIC_ONLY.test(p[0]))errs.push(pa+": must be Arabic text.");
        if(seen.has("P:"+p[0]))errs.push(pa+": "+p[0]+" is already in the app.");seen.add("P:"+p[0]);
        phrases.push([p[0].trim(),p[1],p[2],p[3]])});
      if(!words.length&&!phrases.length)errs.push(at+": needs at least one word or phrase.");
      steps.push({t:[s.t&&s.t[0]||"",s.t&&s.t[1]||""],en:typeof s.en==="string"?s.en:"",ru:typeof s.ru==="string"?s.ru:"",root,words,phrases});
    });
  }
  if(errs.length)return{errs};
  return{pack:{id:raw.id,title:typeof raw.title==="string"?raw.title:raw.id,roots,steps}};
}
function importPackText(text){
  text=String(text||"").trim().replace(/^```[a-z]*\s*/i,"").replace(/\s*```$/,"");
  if(!text)return setMsg("pack","bad",bi("Paste a lesson pack first, or choose a file.","Сначала вставьте пакет или выберите файл."));
  let raw;try{raw=JSON.parse(text)}catch(e){return setMsg("pack","bad","Not valid JSON ("+esc(e.message)+"). Copy the whole code block from Claude’s reply.")}
  const others=PACKS.filter(p=>!(raw&&raw.id===p.id));
  const res=validatePack(raw,others);
  if(!res.pack)return setMsg("pack","bad","<b>"+bi("Could not add this pack.","Не удалось добавить пакет.")+"</b>"+errList(res.errs));
  const pack=res.pack,existed=PACKS.some(p=>p.id===pack.id),next=others.concat([pack]);
  if(!savePacks(next))return setMsg("pack","bad","Could not save: browser storage is full or blocked.");
  PACKS=next;buildData();
  const nw=pack.steps.reduce((n,s)=>n+s.words.length,0),np=pack.steps.reduce((n,s)=>n+s.phrases.length,0);
  MSG.pack={kind:"ok",html:`<b>${existed?bi("Updated","Обновлено"):bi("Added","Добавлено")} “${esc(pack.title)}”</b> · ${pack.steps.length} ${bi("steps","шагов")}, ${nw} ${bi("words","слов")}, ${np} ${bi("phrases","фраз")}. ${bi("They are at the end of the Path.","Они в конце пути.")}`};
  render();
}
function claudePrompt(){
  const pats=Object.keys(C.pats).map(k=>k+" = "+C.pats[k].t+" ("+C.pats[k].en+")").join("; ");
  const roots=Object.keys(ROOTM).join(" ");
  const words=WORDS.map(w=>skel(w.ar)).join(" ");
  return `Make a lesson pack for my Jidr Arabic app. Reply with ONE JSON code block and nothing else.

Topic: [describe the topic, or paste the words you want]

Format:
{"id":"food-2","title":"Food 2","roots":{"طبخ":["cook","готовить"]},"steps":[{"t":["Cooking","Готовка"],"en":"One-sentence tip in English.","ru":"Совет в одно предложение по-русски.","root":"طبخ","words":[["طَبَخَ","ṭabakha","he cooked","он приготовил","طبخ","v"]],"phrases":[["أَنا أَطبُخُ","anā aṭbukhu","I'm cooking","Я готовлю"]]}]}

Rules:
- High-frequency, everyday Modern Standard Arabic. 4 to 8 words and 1 to 3 short phrases per step. Prefer steps built around one root, so I learn the family together.
- Each word: [one Arabic word with full vowel marks, transliteration, English, Russian, root ("" if none), pattern code ("" if none)].
- Each phrase: [Arabic with full vowel marks, transliteration, English, Russian].
- Pattern codes: ${pats}.
- Roots are 3 (or 4) consonants without vowel marks. List the meaning of every new root in "roots".
- Transliteration style: ā ī ū ḥ ṣ ḍ ṭ ẓ ʿ ʾ kh sh gh dh th.
- Do not use the characters < or >. Do not repeat words already in the app.

Roots already in the app: ${roots}
Words already in the app: ${words}`;
}

function restoreText(text){
  text=String(text||"").trim();
  if(!text)return setMsg("backup","bad",bi("Paste a backup first, or choose a file.","Сначала вставьте копию или выберите файл."));
  let o;try{o=JSON.parse(text)}catch(e){return setMsg("backup","bad","This is not a valid backup file.")}
  if(!o||o.app!=="jidr"||!o.state||typeof o.state!=="object")return setMsg("backup","bad","This does not look like a Jidr backup.");
  const packs=[],errs=[];
  (Array.isArray(o.packs)?o.packs:[]).forEach((raw,i)=>{const r=validatePack(raw,packs);if(r.pack)packs.push(r.pack);else errs.push("Pack "+(i+1)+": "+r.errs[0])});
  if(errs.length)return setMsg("backup","bad","<b>Some lesson packs in this backup could not be read.</b>"+errList(errs));
  if(!confirm("Replace the progress and lessons on this device with this backup?"))return;
  if(!savePacks(packs))return setMsg("backup","bad","Could not save: browser storage is full or blocked.");
  S=migrate(o.state);S.tab="manage";PACKS=packs;buildData();S.done=S.done.filter(id=>STEPS.some(s=>s.id===id));save();
  MSG.backup={kind:"ok",html:bi("Backup restored.","Копия восстановлена.")};render();
}
async function importAudioText(text){
  let o;try{o=JSON.parse(text)}catch(e){return setMsg("audio","bad",bi("This is not a recordings file.","Это не файл с записями."))}
  const tmp={};const n=(()=>{if(!o||o.app!=="jidr-audio"||!o.clips)return -1;let c=0;Object.keys(o.clips).forEach(k=>{const x=o.clips[k];if(/^[LWP]:/.test(k)&&x&&typeof x.m==="string"&&/^audio\//.test(x.m)&&typeof x.d==="string"){tmp[k]={m:x.m,d:x.d};c++}});return c})();
  if(n<=0)return setMsg("audio","bad",bi("No recordings found in this file.","В файле нет записей."));
  let prev=null;try{prev=await idbGet("audio")}catch(e){}
  const merged={app:"jidr-audio",v:1,clips:Object.assign({},prev&&prev.clips||{},tmp)};
  try{await idbSet("audio",merged)}catch(e){return setMsg("audio","bad",bi("Could not save recordings on this device.","Не удалось сохранить записи на устройстве."))}
  addClips(merged,"local");
  const match=Object.keys(tmp).filter(k=>ITEMS[k]).length;
  MSG.audio={kind:"ok",html:bi(`Loaded ${n} recordings (${match} match current lessons). Look for the speaker icons.`,`Загружено записей: ${n} (к урокам подходят: ${match}). Ищите значок динамика.`)};
  render();
}

  if(a==="addpack")return importPackText($("#pack-text").value);
  if(a==="prompt")return copyText(claudePrompt(),"pack","Prompt copied. Paste it into a chat with Claude and add the topic.","Запрос скопирован. Вставьте его в чат с Claude и добавьте тему.");
  if(a==="rm"){const p=PACKS.find(x=>x.id===t.dataset.id);if(!p||!confirm("Remove “"+p.title+"”? Your progress is kept."))return;const next=PACKS.filter(x=>x!==p);if(!savePacks(next))return;PACKS=next;buildData();return render()}
  if(a==="dl"){download("jidr-backup-"+dayStr()+".json",backupJSON());MSG.backup={kind:"ok",html:bi("Backup downloaded. Check your Downloads folder.","Копия скачана. Проверьте «Загрузки».")};return render()}
  if(a==="copybk")return copyText(backupJSON(),"backup","Backup copied. Paste it into a note or a message to yourself.","Копия скопирована. Вставьте её в заметку или сообщение себе.");
  if(a==="restore")return restoreText($("#restore-text").value);
  if(a==="copylink")return copyText(recLink(),"audio","Link copied.","Ссылка скопирована.");
  if(a==="share"){if(navigator.share){try{await navigator.share({title:"Jidr recorder",text:"Could you record these Arabic words for me?",url:recLink()})}catch(e){}return}return copyText(recLink(),"audio","Link copied.","Ссылка скопирована.")}
  if(a==="rmaudio"){if(!confirm("Remove recordings loaded on this device? Recordings on your website stay."))return;try{await idbDel("audio")}catch(e){}MSG.audio=null;return loadAudio()}
  if(a==="install"&&deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;refreshDevice()})}
}
document.addEventListener("change",e=>{
  const inp=e.target;if(!inp||inp.type!=="file"||!inp.files||!inp.files[0])return;
  const f=inp.files[0],k={"pack-file":"pack","restore-file":"backup","audio-file":"audio"}[inp.id];if(!k)return;
  if(f.size>(k==="audio"?40e6:2e6))return setMsg(k,"bad","That file is too large.");
  f.text().then(txt=>{inp.value="";if(k==="pack")importPackText(txt);else if(k==="backup")restoreText(txt);else importAudioText(txt)}).catch(()=>setMsg(k,"bad","Could not read that file."));
});

/* ================= router and events ================= */
const TABS=["path","practice","letters","roots","manage"];
function render(){
  renderStats();
  const v=$("#view");
  if(Q){v.innerHTML=Q.i>=Q.qs.length?(finishQuiz(),renderStats(),renderEnd()):renderQuiz();return}
  const map={path:()=>UI.step?renderStep():renderPath(),practice:renderPractice,letters:renderLetters,roots:renderRoots,manage:renderManage};
  v.innerHTML=(map[S.tab]||renderPath)();
}
function go(tab){if(tab!==S.tab)MSG={};S.tab=tab;UI.step=null;if(Q){Q=null}save();render();window.scrollTo(0,0);if(location.hash!=="#"+tab)history.replaceState(null,"","#"+tab)}
function openStep(id){UI.step=id;S.tab="path";Q=null;history.pushState({s:1},"");render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.play!==undefined){e.stopPropagation();return play(d.play,t)}
  if(d.tr!==undefined){const s=document.createElement("span");s.className="trs";s.textContent=d.tr;t.replaceWith(s);return}
  if(Q){
    if(d.opt!==undefined)return pickOpt(t);
    if(d.tile!==undefined)return tileTap(t);
    if(d.undo!==undefined)return undo();
    if(d.check!==undefined)return check();
    if(d.next!==undefined)return next();
    if(d.quit!==undefined){if(Q.i>0&&Q.i<Q.qs.length&&!confirm("Stop this drill? Answers so far are saved."))return;Q=null;return render()}
    if(d.again!==undefined){const its=uniq(Q.wrong);setPool();const qs=its.map(it=>genFor(it,0)).filter(Boolean);Q=null;return startQuiz(shuffle(qs.concat(qs.map(x=>genFor(x.item,1)).filter(Boolean))).slice(0,10),{})}
    if(d.endq!==undefined){const st=d.step;Q=null;if(st)return openStep(st);UI.step=null;return render()}
  }
  if(d.lang){S.lang=d.lang;save();return render()}
  if(d.tab)return go(d.tab);
  if(d.step)return openStep(d.step);
  if(d.back!==undefined){UI.step=null;return render()}
  if(d.stepquiz){const st=STEPS.find(s=>s.id===d.stepquiz);return startQuiz(buildStepQuiz(st),{step:st.id})}
  if(d.skip){const st=STEPS.find(s=>s.id===d.skip);if(st&&confirm("Mark this step as done without the drill?")){markDone(st);UI.step=null;render();toast(bi("Step marked done","Шаг отмечен"))}return}
  if(d.drill){const D=DRILLS[d.drill];if(!D||!D.ok())return;return startQuiz(D.build(),{drill:d.drill})}
  if(d.view){S.letView=d.view;UI.openL=null;save();return render()}
  if(d.let){UI.openL=UI.openL===d.let?null:d.let;render();if(UI.openL&&hasA("L:"+d.let))play("L:"+d.let);return}
  if(d.playall){const ks=[...d.playall].map(c=>"L:"+c).filter(hasA);let i=0;const nx=()=>{if(i<ks.length){play(ks[i++]);player.onended=()=>setTimeout(nx,350)}else player.onended=null};return nx()}
  if(d.set){const [k,v]=d.set.split(":");S[k]=k==="auto"?v==="1":v;save();return render()}
  if(d.act)return act(t);
});
window.addEventListener("popstate",()=>{if(Q){Q=null;return render()}if(UI.step){UI.step=null;return render()}});

/* ================= boot ================= */
(function boot(){
  try{const raw=localStorage.getItem("jidr-packs");const a=raw?JSON.parse(raw):[];
    if(Array.isArray(a)){const ok=[];a.forEach(p=>{const r=validatePack(p,ok);if(r.pack)ok.push(r.pack)});PACKS=ok}}catch(e){}
  buildData();
  S.done=S.done.filter(id=>STEPS.some(s=>s.id===id));
  const h=location.hash.slice(1);if(TABS.includes(h))S.tab=h;
  render();
  loadAudio();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    navigator.serviceWorker.ready.then(()=>{swReady=true;refreshDevice()}).catch(()=>{});
  }
  if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(p=>p||(navigator.storage.persist?navigator.storage.persist():false)).then(p=>{persisted=!!p;refreshDevice()}).catch(()=>{});
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;refreshDevice()});
  window.addEventListener("appinstalled",()=>{deferredInstall=null;refreshDevice()});
})();
</script>
