<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jidr Arabic</title>
<meta name="description" content="Learn Arabic by roots">
<meta name="theme-color" content="#EEF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1A1E" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jidr">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* One column of cards under a sticky header. Root letters are always amber; the letter being asked about is pink. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#12232A; --mute:#566B70; --line:#D2DCDA;
  --accent:#0B5F66; --accent-ink:#FFFFFF; --tint:#DCEBEA;
  --root:#B4630A; --root-tint:#F7E6D0; --hit:#C2185B;
  --good:#1F7A3F; --good-tint:#DDF0E3; --bad:#B3261E; --bad-tint:#F8DEDB;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest','Noto Sans','Segoe UI',system-ui,sans-serif;
  --f-ar:'Amiri','Noto Naskh Arabic','Geeza Pro','Traditional Arabic',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1A1E; --surface:#14262B; --ink:#E6F0EE; --mute:#93AAAE; --line:#263C42;
  --accent:#5CC4C9; --accent-ink:#06282B; --tint:#1B3A3F;
  --root:#F0A04B; --root-tint:#3A2A14; --hit:#FF79B0;
  --good:#5BC47E; --good-tint:#16301F; --bad:#FF8A80; --bad-tint:#3A1B19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A1E; --surface:#14262B; --ink:#E6F0EE; --mute:#93AAAE; --line:#263C42;
  --accent:#5CC4C9; --accent-ink:#06282B; --tint:#1B3A3F;
  --root:#F0A04B; --root-tint:#3A2A14; --hit:#FF79B0;
  --good:#5BC47E; --good-tint:#16301F; --bad:#FF8A80; --bad-tint:#3A1B19; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:760px;margin:0 auto;padding-block:0 64px}
h1,h2,h3,p{margin:0}
h2{font:700 15px/1.3 var(--f-display);letter-spacing:.01em;text-wrap:balance}
h3{font:600 15px/1.3 var(--f-body)}
small,.muted{color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.6}
.rt{color:var(--root)}
.hit{color:var(--hit)}
.l-ru{color:var(--mute)}
.ai{font-family:var(--f-ar);font-size:1.3em;line-height:1;direction:rtl;unicode-bidi:isolate;white-space:nowrap}
body[data-lang="en"] .l-ru,body[data-lang="en"] .t-ru{display:none}
body[data-lang="ru"] .l-en,body[data-lang="ru"] .t-en,body[data-lang="both"] .t-ru{display:none}
body[data-lang="ru"] .l-ru{color:inherit}
body[data-lang="both"] .l-en+.l-ru::before{content:" · "}
.bl .l-en,.bl .l-ru{display:block}
body[data-lang="both"] .bl .l-en+.l-ru::before{content:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-top:10px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-ar{font-size:30px;line-height:1;color:var(--root)}
.brand b{font:700 15px var(--f-display)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:5px 9px;font-size:12px;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--tint);padding:2px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.pill.root{background:var(--root-tint);color:var(--root)}
.pill.warn{background:var(--bad-tint);color:var(--bad)}
.pill.pop{animation:pop .4s}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);margin-top:6px}
.tabs button{border:0;background:transparent;padding:10px 2px 9px;font-weight:500;font-size:13.5px;color:var(--mute);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-top:16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lead{color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary .l-ru,.hero .l-ru,.dr.main .l-ru,.seg button[aria-pressed="true"] .l-ru,.lang .l-ru{color:inherit;opacity:.85}
.btn.big{padding:13px 18px;font-size:16px;width:100%}
.btn.link{border:0;background:none;padding:4px 0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:13.5px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar{height:8px;border-radius:6px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.root i{background:var(--root)}

/* small controls */
.spk{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:0;background:var(--tint);color:var(--accent)}
.spk.big{width:64px;height:64px}
.spk.big svg{width:30px;height:30px}
.spk.playing{background:var(--accent);color:var(--accent-ink)}
.trv{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:0 7px;font-size:12px;color:var(--mute);min-height:26px}
.trs{font-style:italic;color:var(--mute);font-size:13.5px}
.pchip{display:inline-block;border-radius:6px;background:var(--root-tint);padding:0 8px;font-size:18px;line-height:1.5}
.tag{display:inline-block;font-size:11.5px;border-radius:5px;padding:0 6px;background:var(--tint);color:var(--mute)}

/* path */
.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .muted,.hero small{color:inherit;opacity:.8}
.hero .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink);font-weight:600}
.hero-ar{font-size:44px;line-height:1.4;letter-spacing:.08em}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--tint);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.kpi small{font-size:12px}
.steps{display:flex;flex-direction:column;gap:8px}
.st{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.st:disabled{cursor:default}
.st.locked{opacity:.55}
.st.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.st-n{width:30px;height:30px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font:700 12px var(--f-display)}
.st.done .st-n{background:var(--good);color:var(--surface)}
.st.cur .st-n{background:var(--accent);color:var(--accent-ink)}
.st-t{min-width:0}
.st-t b{display:block;font-weight:600;line-height:1.3}
.st-t small{display:block;font-size:12.5px}
.st-ar{font-size:24px;line-height:1.3;color:var(--root);max-width:34vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* step page */
.back{align-self:flex-start;border:0;background:none;color:var(--accent);padding:2px 0;font-weight:500}
.kind{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.lcard{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-top:1px dashed var(--line)}
.lcard:first-of-type{border-top:0}
.big{font-size:64px;line-height:1.2;text-align:center;color:var(--accent)}
.lc-meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.nm{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tr{font-style:italic;color:var(--mute)}
.dots{display:inline-block;background:var(--root-tint);color:var(--root);border-radius:6px;padding:0 8px;font-size:12.5px;font-weight:500;align-self:flex-start}
.snd{font-size:13.5px}
.snd .lg{display:inline-block;width:24px;font-size:11px;font-weight:600;color:var(--mute)}
.forms{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.fm{text-align:center;min-width:56px;background:var(--tint);border-radius:8px;padding:2px 8px 3px}
.fm .ar{font-size:30px;line-height:1.85;display:block}
.fm small{margin-top:-2px}
.fm small{font-size:10.5px;display:block}
.alike{grid-column:1 / -1;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.alike .ar{font-size:24px;line-height:1.2}
.alike .me{color:var(--accent)}
.marks{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.mk{background:var(--tint);border-radius:10px;padding:6px;text-align:center}
.mk .ar{font-size:32px;line-height:1.4}
.mk b{display:block;font-size:13px}
.mk small{font-size:11.5px;display:block}
.wl{display:flex;flex-direction:column}
.wr{display:grid;grid-template-columns:minmax(104px,40%) minmax(0,1fr);gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wr:first-child{border-top:0}
.wr .w-ar{font-size:32px;line-height:1.45;text-align:center}
.wr.ph{grid-template-columns:1fr}
.wr.ph .w-ar{font-size:30px;text-align:right}
.w-i{min-width:0;display:flex;flex-direction:column;gap:4px}
.w-i .row{gap:6px}
.wr.locked .w-ar{opacity:.45}
.need{font-size:12px;color:var(--mute)}
.rootbig{font-size:52px;line-height:1.3;letter-spacing:.25em;color:var(--root);text-align:center}
.patbig{font-size:46px;line-height:1.4;text-align:center}
.sticky-cta{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.sticky-cta .btn.primary{box-shadow:0 6px 20px rgba(0,0,0,.18)}

.lex{grid-column:1 / -1;display:flex;flex-direction:column;gap:2px;margin-top:4px}
.lx{display:grid;grid-template-columns:minmax(96px,38%) minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:4px 0}
.lx .ar{font-size:32px;line-height:1.5;text-align:center}
.lx>span:nth-child(2){font-size:14px}
.splt{display:block;width:100%;font-size:28px;line-height:1.6;letter-spacing:.06em;color:var(--accent)}
.wr.ph .splt{text-align:right}
.trv[aria-pressed="true"]{border-style:solid;color:var(--accent)}
.mrk{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.mrk:first-of-type{border-top:0}
.mrk-ex{font-size:34px;text-align:center;color:var(--accent)}
.mrk p{font-size:14px;color:var(--mute)}
.syl{display:flex;flex-wrap:nowrap;gap:5px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.syl:first-of-type{border-top:0}
.sy{flex:1 1 40px;min-width:0;max-width:60px;text-align:center;background:var(--tint);border-radius:8px;padding:0 2px}
.sy .ar{display:block;font-size:28px;line-height:1.9}
.sy small{display:block;font-size:12px;line-height:1.2;padding-bottom:2px}

button.pchip{border:0;color:inherit;cursor:pointer}
button.pc{border:0;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
button.pc .tag{margin-top:4px}
.pbtn{display:block;width:100%;border:0;background:none;color:inherit;font-family:var(--f-ar)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;
  padding:12px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-width:760px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet .x{border:0;background:none;font-size:26px;line-height:1;color:var(--mute);padding:2px 8px}
.peqs{display:flex;flex-direction:column}
.peq{padding:8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.peq:first-child{border-top:0}
.peq.locked .peq-f{opacity:.6}
.peq-f{font-size:26px;line-height:1.6;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;justify-content:flex-start}
.peq-f .r{color:var(--root);letter-spacing:.2em}
.peq-f .pt{font-size:22px;opacity:.85}
.peq-f .plus{font:600 16px var(--f-body);color:var(--mute)}
.peq-f .w{font-size:32px}
.peq-m{font-size:14px}
body.noscroll{overflow:hidden}

.sylg{display:grid;grid-template-columns:34px repeat(6,minmax(0,1fr));gap:5px;align-items:center}
.sylg .vh{text-align:center;font-size:12.5px;color:var(--mute);font-weight:600}
.sylg .sy{text-align:center;background:var(--tint);border-radius:8px;font-size:28px;line-height:1.9;min-width:0}
.sylg .sys .spk{width:30px;height:30px}
.lname{font-size:24px;line-height:1.3;color:var(--accent)}
.cue{font-size:14px;color:var(--mute)}
.mn{font-size:13.5px;background:var(--tint);border-radius:8px;padding:4px 8px}
.q-cue{font:600 22px/1.35 var(--f-body);color:var(--accent);max-width:22ch}
.vchip{display:inline-block;border-radius:999px;background:var(--root-tint);color:var(--root);font:700 18px var(--f-display);padding:2px 14px}
.vl{font:700 20px var(--f-display)}
.q-pic,.pic{font-size:54px;line-height:1.2}
.pic{font-size:40px}
.gl{font-size:24px;color:var(--root);letter-spacing:.15em}
.fact{background:var(--tint);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.fact .fk{font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--accent)}
.fact p{font-size:14.5px}
details.disc>summary{list-style:none;cursor:pointer}
details.disc>summary::-webkit-details-marker{display:none}
.sess{gap:8px}
.sb{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%}
.sb:disabled{opacity:.5}
.sb-n{width:28px;height:28px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font:700 12px var(--f-display)}
.sb.ok .sb-n{background:var(--good);color:var(--surface)}
.sb-t{min-width:0}.sb-t b{display:block;font-weight:600;line-height:1.3}.sb-t small{display:block;font-size:12.5px}
.sb-m{font-size:12px;color:var(--mute)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.pair:first-of-type{border-top:0}
.pw{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pw .ar{font-size:34px;line-height:1.5}
.pw small{font-size:12.5px}
.vs{font-size:20px;color:var(--mute)}
.story-t{font-size:30px;line-height:1.9;text-align:right}
.story details>summary{cursor:pointer;color:var(--accent);font-weight:500}

.kb{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.kbr{display:flex;gap:4px;justify-content:center}
.kbk{flex:1 1 0;min-width:0;max-width:44px;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:24px/1 var(--f-ar);padding:0}
.kbk.wide{max-width:none;flex:4 1 0;font:500 14px var(--f-body)}
.kbk:active{background:var(--tint)}
.typed{min-height:66px}
.hint{display:block;text-align:center;letter-spacing:.2em;color:var(--mute);font-size:14px}
.skills>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.skills>summary::-webkit-details-marker{display:none}
.skills h3{margin-top:8px}
.skr{display:flex;flex-direction:column;gap:3px;padding:4px 0}
.skr-t{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:14px}
.skr-t>span{flex:1 1 12em;min-width:0}
.skr-t small{white-space:nowrap}
.skb{position:relative;height:8px;border-radius:6px;background:var(--tint)}
.skb i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.skb b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.5}
.txt{display:flex;flex-direction:column;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.txt:first-of-type{border-top:0}
.tl{display:inline}
.tlist{display:flex;flex-direction:column;gap:6px}
.tli{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.tli span{width:26px;height:26px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font:700 11px var(--f-display);flex:none}
.tli.later{opacity:.6}
.spk-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.spk-row small{display:block}
.vgrid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.vgrid{border-collapse:collapse;font-size:14px}
.vgrid th,.vgrid td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.vgrid td .ar{font-size:22px}
.vgrid .dim{opacity:.45}
.vgrid th.ar{font-size:20px;letter-spacing:.15em}
a{color:var(--accent)}

/* letters + roots tabs */
.ltiles{display:flex;flex-wrap:wrap;gap:8px;direction:rtl}
.lt{width:56px;height:62px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:32px/1 var(--f-ar);display:grid;place-items:center;position:relative}
.lt.off{opacity:.4}
.lt[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lt .au{position:absolute;top:3px;left:4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
details.rt-d{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.rt-d>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
details.rt-d>summary::-webkit-details-marker{display:none}
.r-ar{font-size:30px;line-height:1.3;letter-spacing:.2em;color:var(--root);min-width:84px;text-align:center}
.r-t{flex:1;min-width:0}
.r-t small{display:block}
.chev{flex:none;transition:transform .15s;color:var(--mute)}
details[open] .chev{transform:rotate(90deg)}
details.rt-d .wl{padding:0 14px 8px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pc{background:var(--tint);border-radius:10px;padding:8px 10px;text-align:center}
.pc .ar{font-size:30px;display:block;line-height:1.5}
.pc small{display:block;font-size:12px}
.pc .ex{font-size:20px;color:var(--ink)}

/* practice */
.drills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.dr{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dr b{font-weight:600}
.dr .ar{font-size:26px;line-height:1.3;color:var(--root)}
.dr:disabled{opacity:.5}
.dr.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dr.main small,.dr.main .ar{color:inherit;opacity:.85}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;align-items:center;gap:10px}
.qhead .x{border:0;background:none;font-size:24px;line-height:1;color:var(--mute);padding:4px 6px}
.qhead .bar{flex:1}
.qlabel{font-weight:600;color:var(--mute);text-align:center}
.qbox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:110px;justify-content:center}
.q-letter{font-size:104px;line-height:1.75;color:var(--accent)}
.q-word{font-size:60px;line-height:1.45}
.q-phrase{font-size:38px;line-height:1.6}
.q-mean{font:600 22px/1.35 var(--f-body)}
.q-snd{font:700 34px var(--f-display);color:var(--accent)}
.q-root{font-size:34px;line-height:1.4}
.q-root .r{color:var(--root);letter-spacing:.25em}
.q-root .plus{font:600 22px var(--f-body);color:var(--mute);margin:0 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.one{grid-template-columns:1fr}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;min-height:58px;text-align:center;min-width:0;overflow-wrap:anywhere}
.opt .ar{font-size:34px;line-height:1.35}
.opt .ar.sm{font-size:26px}
.opt small{display:block;font-size:12px}
.opt.right{background:var(--good-tint);border-color:var(--good);animation:pop .3s}
.opt.wrong{background:var(--bad-tint);border-color:var(--bad);animation:shake .3s}
.built{min-height:72px;border-bottom:2px solid var(--line);font-size:48px;line-height:1.45;text-align:center;padding:0 8px}
.built.ok{border-color:var(--good);color:var(--good)}
.built.no{border-color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:52px;height:58px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font:32px/1 var(--f-ar)}
.tile.w{font-size:26px}
.tile:disabled{opacity:.25}
.fb{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.fb.right{background:var(--good-tint)}
.fb.wrong{background:var(--bad-tint)}
.fb .ar{font-size:30px;line-height:1.45}
.fb .row{gap:8px}
.score{font:700 46px var(--f-display);text-align:center;color:var(--accent)}
.unl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.unl>span{background:var(--root-tint);border-radius:10px;padding:2px 12px;font-size:28px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
#toast.on{opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* manage */
.ta{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ta.sm{min-height:60px}
label.btn{display:inline-block}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
.msg.ok{background:var(--good-tint)}
.msg.bad{background:var(--bad-tint)}
.msg ul{margin:4px 0 0;padding-left:18px}
.packrow,.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.packrow:first-child,.kv:first-child{border-top:0}
.packrow>div{flex:1;min-width:0}
.packrow b,.packrow small{display:block}
.kv span:last-child{text-align:right}
.mono{font:13px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}

@media (max-width:400px){.q-letter{font-size:88px}.q-word{font-size:50px}.q-phrase{font-size:32px}.big{font-size:54px}.lcard{grid-template-columns:70px minmax(0,1fr)}.tabs button{font-size:12.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
</style>

<audio id="player" preload="none"></audio>
<script src="course.js"></script>
<script>
"use strict";
/* ================= basics ================= */
const C=window.COURSE;
const APP_VERSION="3.1.0",STATE_VER=2;
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AR_RUN=/[\u25CC\u0600-\u06FF]+(?:[ \u00A0]+[\u25CC\u0600-\u06FF]+)*/g;
const ai=t=>/class="ar|data-/.test(t)?t:String(t).replace(AR_RUN,m=>`<span class="ai" lang="ar">${m}</span>`);
const bi=(en,ru)=>`<span class="l-en">${ai(en)}</span><span class="l-ru">${ai(ru)}</span>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uniq=a=>[...new Set(a)];
const ZWJ="‍";
const HAR=/[ً-ٰٟـ]/;
const PUNCT=/[\s؟،.!?,]/;
const SEAT={"أ":"اء","إ":"اء","آ":"اء","ؤ":"وء","ئ":"يء","ى":"ي"};
const BASE={"أ":"ا","إ":"ا","آ":"ا","ؤ":"و","ئ":"ي","ى":"ي"};
const skel=s=>[...s].filter(c=>!HAR.test(c)).join("");
const nrm=s=>[...skel(s)].map(c=>BASE[c]||c).join("");
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function clusters(ar){const out=[];for(const ch of ar){if(HAR.test(ch)&&out.length)out[out.length-1]+=ch;else out.push(ch)}return out}

/* ================= letters ================= */
const LET=C.letters.map(a=>({c:a[0],n:a[1],tr:a[2],en:a[3],ru:a[4],dots:C.dots[a[5]],conn:!!a[6],fam:a[7],say:a[8],key:"L:"+a[0]}));
const byC={};LET.forEach(l=>byC[l.c]=l);
const LI=C.letterInfo||{};LET.forEach(l=>{const x=LI[l.c]||[];l.name=x[0]||l.c;l.cue=x[1]||[l.tr,l.tr];l.mn=x[2]||null});
C.sounds.forEach((g,i)=>{for(const c of g.L)if(byC[c])byC[c].sg=i});
function reqLetters(ar){const o=new Set();for(const ch of ar){if(HAR.test(ch)||PUNCT.test(ch))continue;for(const c of (SEAT[ch]||ch))if(byC[c])o.add(c)}return [...o]}
function forms(l){
  if(l.c==="ء")return [["alone","отдельно",l.c]];
  if(l.c==="ة")return [["alone","отдельно",l.c],["end","в конце","ـ"+l.c]];
  if(l.conn)return [["alone","отдельно",l.c],["start","в начале",l.c+"ـ"],["middle","в середине","ـ"+l.c+"ـ"],["end","в конце","ـ"+l.c]];
  return [["alone","отдельно",l.c],["end","в конце","ـ"+l.c]];
}

/* ================= saved data (lives on this phone) =================
   localStorage "jidr-state": progress + settings. "jidr-packs": lessons added in the app.
   Recordings loaded from a file live in IndexedDB. Code updates never touch any of these.
   If the saved shape changes, bump STATE_VER and upgrade inside migrate(). */
const DEF={ver:STATE_VER,done:[],srs:{},lang:"both",tab:"path",xp:0,streak:0,lastDay:0,tr:"off",auto:true,sess:null,seenF:[],vz:"full",sk:{},ct:{},readT:[],letView:"shape",lastBackup:0};
let S=Object.assign({},DEF,{done:[],srs:{}});
let PACKS=[],storageOK=true;
function migrate(s){
  s=Object.assign({},DEF,{done:[],srs:{}},s||{});
  if(!s.ver||s.ver<2){ /* v1 tracked letter groups of the old layout; the path is new, so it starts fresh */
    s.done=[];s.srs={};if(s.tab&&!["path","practice","letters","roots","manage"].includes(s.tab))s.tab="path";delete s.learned;delete s.best;s.ver=2;
  }
  if(!Array.isArray(s.done))s.done=[];
  if(!s.srs||typeof s.srs!=="object")s.srs={};
  if(!["en","ru","both"].includes(s.lang))s.lang="both";
  if(!["off","tap"].includes(s.tr))s.tr="off";
  if(!Array.isArray(s.seenF))s.seenF=[];
  if(!["full","fade","off"].includes(s.vz))s.vz="full";
  if(!s.sk||typeof s.sk!=="object")s.sk={};
  if(!s.ct||typeof s.ct!=="object")s.ct={};
  if(!Array.isArray(s.readT))s.readT=[];
  return s;
}
try{const raw=localStorage.getItem("jidr-state");if(raw)S=migrate(JSON.parse(raw))}catch(e){}
try{localStorage.setItem("jidr-probe","1");localStorage.removeItem("jidr-probe")}catch(e){storageOK=false}
const save=()=>{try{localStorage.setItem("jidr-state",JSON.stringify(S))}catch(e){storageOK=false}};
const savePacks=a=>{try{localStorage.setItem("jidr-packs",JSON.stringify(a));return true}catch(e){return false}};

/* ================= gentle ramp: marks, syllables, word weight =================
   Words are shown lightest first. Each extra mark is explained in the step where it first appears.
   Letter steps start with syllables (بَ بِ بُ با بي بو) before whole words. */
/* vowel marks: full, fading for well-known items, or off (like adult texts) */
const bare=ar=>[...ar].filter(c=>!/[\u064B-\u0652\u0670]/.test(c)).join("");
function vz(it){const ar=it.ar;if(S.vz==="off")return bare(ar);if(S.vz==="fade"){const r=S.srs[it.key];if(r&&r.b>=4)return bare(ar)}return ar}
const weight=ar=>{let w=skel(ar).replace(/\s/g,"").length;for(const c of ar){if(c==="\u0651")w+=2;else if(/[\u064B-\u064D\u0670]/.test(c))w+=2}if(/[آإؤئى]/.test(ar))w+=1;if(/(^|\s)ال/.test(ar))w+=1;return w};
const MARKS=[
 {k:"al",test:a=>/(^|\s)(وَ)?ال/.test(a),t:["الـ means “the”","الـ — артикль"],
  en:"الـ at the start of a word means “the”: يَوم day → اليَوم the day (today). The alif is silent inside a phrase.",
  ru:"الـ в начале слова — определённый артикль: يَوم день → اليَوم этот день (сегодня). Внутри фразы алиф не читается."},
 {k:"shadda",test:a=>a.includes("\u0651"),t:["◌ّ shadda: say the letter twice","◌ّ шадда: буква звучит дважды"],
  en:"The small w-shaped mark doubles the letter: أُمّ is umm, held a little longer.",
  ru:"Маленький значок в форме w удваивает букву: أُمّ — это «умм», с задержкой на м."},
 {k:"dagger",test:a=>a.includes("\u0670"),t:["◌ٰ small alif: a hidden long ā","◌ٰ маленький алиф: скрытое долгое ā"],
  en:"A tiny upright alif above a letter is a long ā: لٰكِن = lākin. Only a handful of very common words use it.",
  ru:"Крошечный вертикальный алиф над буквой — это долгое ā: لٰكِن = ляакин. Встречается лишь в нескольких частых словах."},
 {k:"tanwin",test:a=>/[\u064B-\u064D]/.test(a),t:["◌ً tanwīn: an -n at the end","◌ً танвин: -н в конце"],
  en:"A doubled vowel mark at the end adds -n: أَهلاً = ahlan. The alif after it is just a seat, not read.",
  ru:"Удвоенный значок гласной в конце добавляет -н: أَهلاً = ахлян. Алиф после него — подставка, не читается."},
 {k:"madda",test:a=>a.includes("آ"),t:["آ  madda: a catch + long ā","آ  мадда: смычка + долгое ā"],
  en:"The wavy line over alif means hamza followed by a long ā: آكُلُ = ʾākulu.",
  ru:"Волнистая черта над алифом — хамза и долгое ā: آكُلُ = аакулу."},
 {k:"maqsura",test:a=>a.includes("ى"),t:["ى  at the end: long a","ى  в конце: долгое а"],
  en:"ي without dots at the end of a word is read as a long a: عَلى = ʿalā.",
  ru:"ي без точек в конце слова читается как долгое а: عَلى = аля."},
 {k:"seat",test:a=>/[ؤئ]/.test(a),t:["Hamza sitting on و or ي","Хамза на و или ي"],
  en:"Hamza ء can sit on a و (ؤ) or a dotless ي (ئ). The sound stays the same short catch: سُؤال = suʾāl.",
  ru:"Хамза ء может сидеть на و (ؤ) или на ي без точек (ئ). Звук тот же — короткая смычка: سُؤال = суаль."},
 {k:"under",test:a=>a.includes("إ"),t:["إ  hamza below: starts with i","إ  хамза снизу: начало на «и»"],
  en:"Hamza under the alif means the word opens with an i: إِلى = ilā.",
  ru:"Хамза под алифом — слово начинается на «и»: إِلى = иля."}
];
const VK=["a","i","u","ā","ī","ū"];
const VLAB={a:["a","а"],i:["i","и"],u:["u","у"],"ā":["aa","аа"],"ī":["ii","ии"],"ū":["uu","уу"]};
const VMARK={a:"\u064E",i:"\u0650",u:"\u064F"},VLONG={"ā":["\u064E","ا"],"ī":["\u0650","ي"],"ū":["\u064F","و"]};
/* syllables for one letter: short a/i/u, plus long aa/ii/uu when those letters are known */
function sylFor(l,ks){
  if("اءة".includes(l.c))return [];
  const out=["a","i","u"].map(v=>({ar:l.c+VMARK[v],v}));
  Object.keys(VLONG).forEach(v=>{const [m,c]=VLONG[v];if(ks.has(c))out.push({ar:l.c+m+c,v})});
  return out;
}
const vhead=()=>`<span></span>${VK.map(v=>`<span class="vh">${bi(VLAB[v][0],VLAB[v][1])}</span>`).join("")}`;
const sylRow=(l,ks)=>{const sy=sylFor(l,ks);return `<span class="sys">${spk(l.key)}</span>${VK.map(v=>{const x=sy.find(o=>o.v===v);return x?`<span class="sy ar" lang="ar">${x.ar}</span>`:"<span></span>"}).join("")}`};
const lettersUpTo=st=>new Set(STEPS.slice(0,st.si+1).flatMap(s=>s.letters.map(l=>l.c)));
const splitHtml=ar=>clusters(ar).map(c=>c===" "?"\u2003":esc(c)).join(" ");
const splitBtn=ar=>clusters(ar).filter(c=>c.trim()).length<3?"":`<button type="button" class="trv" data-split>${bi("Split","По буквам")}</button><span class="splt ar" lang="ar" hidden>${splitHtml(ar)}</span>`;
function basicVowelCard(){
  const m=[["بَ","a","fatha"],["بِ","i","kasra"],["بُ","u","damma"],["با","ā","+ ا"],["بي","ī","+ ي"],["بو","ū","+ و"]];
  return `<section class="card"><h2>${bi("How to read vowels","Как читать гласные")}</h2>
  <p class="lead">${bi("Letters are consonants. A small mark above or below adds a short vowel. A long vowel is a letter: ا, ي or و. A letter with no mark has no vowel after it.","Буквы — это согласные. Маленький значок сверху или снизу добавляет краткую гласную. Долгая гласная — это буква: ا, ي или و. Буква без значка читается без гласной.")}</p>
  <div class="marks">${m.map(x=>`<div class="mk"><span class="ar">${x[0]}</span><b>${bi(VLAB[x[1]][0],VLAB[x[1]][1])}</b><small>${x[2]}</small></div>`).join("")}</div></section>`;
}
function marksCard(st){
  if(!st.marks||!st.marks.length)return "";
  return `<section class="card"><h2>${bi("New in the writing","Новое в письме")}</h2>${st.marks.map(m=>`<div class="mrk"><div class="ar mrk-ex" lang="ar">${esc(m.ex)}</div><div><b>${bi(m.t[0],m.t[1])}</b><p class="bl">${bi(m.en,m.ru)}</p></div></div>`).join("")}</section>`;
}
function sylCard(st){
  const ks=lettersUpTo(st),ls=st.letters.filter(l=>sylFor(l,ks).length);
  if(!ls.length)return "";
  return `<section class="card"><h2>${bi("Read these first","Сначала слоги")}</h2><p class="lead">${bi("Each new letter with each vowel. The column tells you the vowel; the letter is yours to recognize.","Каждая новая буква с каждой гласной. Столбец подсказывает гласную, а букву узнавайте сами.")}</p>
  <div class="sylg">${vhead()}${ls.map(l=>sylRow(l,ks)).join("")}</div></section>`;
}

/* ================= content model ================= */
let STEPS=[],WORDS=[],PHRASES=[],ITEMS={},ROOTM={},PAIRS={},TEXTS=[];
function buildData(){
  ROOTM=Object.assign({},C.roots);
  STEPS=C.steps.map(s=>Object.assign({},s));
  PACKS.forEach(p=>{
    Object.keys(p.roots||{}).forEach(r=>{if(!ROOTM[r])ROOTM[r]=p.roots[r]});
    p.steps.forEach((s,i)=>STEPS.push(Object.assign({},s,{id:p.id+":"+i,kind:s.root?"root":"theme",pack:p.id})));
  });
  WORDS=[];PHRASES=[];ITEMS={};
  LET.forEach(l=>{l.step=null;ITEMS[l.key]=l;l.type="L"});
  STEPS.forEach((st,si)=>{
    st.si=si;st.letters=st.L?[...st.L].map(c=>byC[c]).filter(Boolean):[];
    st.letters.forEach(l=>{l.step=st});
    st.W=(st.words||[]).map(w=>({type:"W",key:"W:"+w[0],ar:w[0],tr:w[1],en:w[2],ru:w[3],root:w[4]||"",pat:C.pats[w[5]]?w[5]:"",step:st,need:reqLetters(w[0])}));
    st.P=(st.phrases||[]).map(p=>({type:"P",key:"P:"+p[0],ar:p[0],tr:p[1],en:p[2],ru:p[3],step:st,need:reqLetters(p[0]),parts:p[0].split(/\s+/).filter(Boolean)}));
    st.W.sort((a,b)=>weight(a.ar)-weight(b.ar));st.P.sort((a,b)=>weight(a.ar)-weight(b.ar));
    st.W.forEach(w=>{WORDS.push(w);ITEMS[w.key]=w});
    st.P.forEach(p=>{PHRASES.push(p);ITEMS[p.key]=p});
  });
  TEXTS=(C.texts||[]).map(t=>{const st=STEPS.find(x=>x.id===t.after)||STEPS[0];const T={id:t.id,t:t.t,step:st,spoken:!!t.spoken};
    T.items=t.lines.map(l=>({type:"T",key:"T:"+l[0],ar:l[0],tr:l[1]||"",en:l[2],ru:l[3],step:st,text:T,need:reqLetters(l[0]),parts:l[0].split(/\s+/).filter(Boolean)}));
    T.items.forEach(it=>{ITEMS[it.key]=it});return T});

const typeNorm=s=>nrm(String(s)).replace(/[؟،.!?,]/g,"").replace(/\s+/g," ").trim();
function gT_type(it){
  const target=skel(it.ar).replace(/[؟،.!?,]/g,"").trim();if(!target||target.length>36)return null;
  const a=hasA(it.key);
  if(!a&&it.type!=="W")return null;
  return {kind:"type",item:it,label:a?["Listen and type","Слушайте и печатайте"]:["Type the word","Напечатайте слово"],
    prompt:a?spk(it.key,true):meanHtml(it)+(picOf(it)?`<div class="q-pic">${picOf(it)}</div>`:""),audio:a?it.key:null,target,
    hint:target.replace(/\S/g,"•")};
}
const HEAVY="خصضغطقظ";
function gW_heavy(w){
  const sk=skel(w.ar);if(/\s/.test(sk)||sk.length<2)return null;
  const t=[...sk].filter(c=>HEAVY.includes(c)).join("");if(!t)return null;
  return {kind:"tiles",mode:"heavy",item:w,label:["Tap the heavy letters, in order","Нажмите тяжёлые буквы по порядку"],prompt:bigAr(esc(w.ar),"q-word"),
    tiles:[...sk],target:t,join:"",need:t.length,after:`<small>${bi("Always heavy: خ ص ض غ ط ق ظ","Всегда тяжёлые: خ ص ض غ ط ق ظ")}</small>`};
}
/* pictures: meaning without English */
const picOf=w=>C.pics&&C.pics[w.ar];
function gW_pic(w){
  const p=picOf(w);if(!p)return null;
  if(Math.random()<.5){
    const ds=shuffle(uniq(Object.values(C.pics).filter(e=>e!==p))).slice(0,3);
    return {kind:"choice",item:w,label:["Which picture?","Какая картинка?"],prompt:bigAr(esc(vz(w)),"q-word"),opts:shuffle([p,...ds]).map(e=>({k:e,html:`<span class="pic">${e}</span>`})),ans:p};
  }
  const ds=shuffle(pool.W.filter(x=>x!==w&&picOf(x)&&picOf(x)!==p)).slice(0,3);if(ds.length<2)return null;
  return {kind:"choice",item:w,label:LBL.findW,prompt:`<div class="q-pic">${p}</div>`,opts:shuffle([w,...ds]).map(x=>({k:x.key,html:`<span class="ar">${esc(x.ar)}</span>`})),ans:w.key};
}
/* little words that stick: read the parts of a word in Arabic order */
const CL_PRE=[["","",""],["وَ","and","и"],["بِ","with","с"],["لِ","for","для"]];
const CL_SUF=[["ي","my","мой"],["كَ","your (m)","твой (м.)"],["كِ","your (f)","твой (ж.)"],["هُ","his","его"],["ها","her","её"],["نا","our","наш"],["هُم","their","их"]];
const CL_NOUNS=new Set(["بَيت","كِتاب","قَلب","صَديق","دَرس","مَكتَب","مَدرَسة","سَيّارة","عائِلة","رِسالة","عَمَل","قَهوة","مَطعَم","شارِع"]);
const firstSense=t=>String(t).split(/[,;(]/)[0].trim();
function attach(noun,pre,suf){
  let st=noun;if(st.endsWith("ة")){st=st.slice(0,-1);if(!HAR.test(st.slice(-1)))st+="َ";st+="ت"}
  const gen=pre[0]==="بِ"||pre[0]==="لِ";let sf=suf[0],cv="";
  if(sf!=="ي")cv=gen?"ِ":"ُ";
  if(gen){if(sf==="هُ")sf="هِ";if(sf==="هُم")sf="هِم"}
  return pre[0]+st+cv+sf;
}
const gloss=(n,pre,suf,ru)=>[pre[ru?2:1],firstSense(ru?n.ru:n.en),suf[ru?2:1]].filter(Boolean).join(" · ");
function gW_clitic(w){
  if(!CL_NOUNS.has(w.ar))return null;
  const pre=Math.random()<.4?CL_PRE[0]:pick(CL_PRE.slice(1)),suf=pick(CL_SUF);
  const vs=[[pre,suf]];shuffle(CL_SUF.filter(x=>x!==suf)).slice(0,2).forEach(x=>vs.push([pre,x]));vs.push([pick(CL_PRE.filter(x=>x!==pre)),suf]);
  return {kind:"choice",item:w,label:["What is inside this word?","Что внутри этого слова?"],prompt:bigAr(esc(attach(w.ar,pre,suf)),"q-word"),
    opts:shuffle(vs.map(([a,b],i)=>({k:"g"+i,html:bi(esc(gloss(w,a,b,false)),esc(gloss(w,a,b,true)))}))),ans:"g0",one:true,
    after:`<div class="ar">${[pre[0],w.ar,suf[0]].filter(Boolean).map(esc).join(" + ")}</div>`};
}
/* odd one out: which word is from a different root */
function gW_odd(w){
  if(!w.root)return null;
  const fam=uniq(pool.W.filter(x=>x.root===w.root&&x!==w&&nrm(x.ar)!==nrm(w.ar)));if(fam.length<2)return null;
  const rs=new Set(nrm(w.root)),odd=shuffle(pool.W.filter(x=>x.root&&x.root!==w.root&&[...new Set(nrm(x.ar))].filter(c=>rs.has(c)).length>=2))[0];if(!odd)return null;
  return {kind:"choice",item:w,label:["Which word has a different root?","У какого слова другой корень?"],prompt:`<div class="q-root ar"><span class="r">${spaced(w.root)}</span></div>`,
    opts:shuffle([w,...shuffle(fam).slice(0,2),odd]).map(x=>({k:x.key,html:`<span class="ar">${esc(x.ar)}</span>`})),ans:odd.key,
    after:`<div class="ar">${hl(odd.ar,odd.root)} · <span class="rt">${spaced(odd.root)}</span></div>`};
}

const TIERS={L:[[gL_name,gL_pick,gS_read,gL_form],[gL_pick,gL_sound,gL_inword,gS_find,gL_form],[gL_inword,gL_sound,gL_form,gS_find]],
  W:[[gW_mean,gW_pick,gW_pic],[gW_pick,gW_listen,gW_pat,gW_root,gW_spot,gW_pair,gW_clitic,gW_heavy,gW_pic],[gW_spell,gW_root,gW_make,gW_listen,gW_spot,gW_pair,gW_odd,gW_clitic,gT_type]],
  P:[[gP_mean,gP_order],[gP_order,gP_gap],[gP_order,gP_gap]]};
function genFor(it,tier){
  for(let t=tier;t>=0;t--){for(const g of shuffle(TIERS[it.type][t])){const q=g(it);if(q)return q}}
  return null;
}
const tierOf=it=>{const b=(S.srs[it.key]||{b:0}).b;return b<=1?0:b<=3?1:2};
function setPool(extra){
  const ks=knownSet();
  pool.L=uniq(knownLetters().concat(extra&&extra.letters||[]));
  pool.W=uniq(WORDS.filter(learned).concat(extra&&extra.W||[]));
  pool.P=uniq(PHRASES.filter(learned).concat(extra&&extra.P||[]));
  /* words the learner can already read help as distractors too */
  if(pool.W.length<8)pool.W=uniq(pool.W.concat(WORDS.filter(w=>readable(w,new Set([...ks,...pool.L.map(l=>l.c)])))));
}

/* ================= quiz engine ================= */
let Q=null;
function buildStepQuiz(st){
  setPool(st);
  const out=[];
  if(st.kind==="story"){
    st.P.forEach(p=>{const q=gP_mean(p);if(q)out.push(q)});
    shuffle(st.P).slice(0,4).forEach(p=>{const q=pick([gP_order,gP_gap])(p)||gP_order(p);if(q)out.push(q)});
    st.W.forEach(w=>{const q=gW_pic(w)||gW_mean(w);if(q)out.push(q)});
    return out.slice(0,14);
  }
  if(st.kind==="sound"){
    st.W.forEach(w=>{const q=gW_pair(w);if(q)out.push(q)});
    shuffle(st.W).forEach(w=>{const q=gW_heavy(w)||gW_pic(w)||gW_mean(w);if(q&&out.length<12)out.push(q)});
    shuffle(st.W).forEach(w=>{const q=gW_pair(w);if(q&&out.length<15)out.push(q)});
    st.P.forEach(p=>{const q=gP_mean(p);if(q)out.push(q)});
    return out.slice(0,16);
  }
  st.letters.forEach(l=>{const a=pick([gL_name,gL_pick])(l)||gL_pick(l);if(a)out.push(a)});
  st.letters.forEach(l=>{const b=pick([gS_read,gS_find])(l)||gS_read(l);if(b)out.push(b)});
  if(st.letters.length)st.letters.forEach(l=>{const c=pick([gL_form,gL_inword])(l)||gL_form(l)||gL_inword(l);if(c&&out.length<12)out.push(c)});
  const ph=st.kind==="letters"?st.P.slice(0,1):st.P;
  const ws=st.W.slice(0,Math.max(4,16-out.length-ph.length));
  const gens=st.kind==="root"||st.kind==="pattern"?[gW_root,gW_make,gW_pat,gW_mean,gW_pick,gW_spot,gW_odd]:st.kind==="spoken"?[gW_mean,gW_pick,gW_pic]:[gW_mean,gW_pick,gW_spell,gW_spot,gW_pic];
  ws.forEach((w,i)=>{const q=(i<2?(gW_pic(w)||gW_mean(w)):null)||shuffle(gens).map(g=>g(w)).find(Boolean)||genFor(w,0);if(q)out.push(q)});
  if(st.id==="c01")shuffle(pool.W.filter(w=>CL_NOUNS.has(w.ar))).slice(0,5).forEach(n=>{const q=gW_clitic(n);if(q)out.push(q)});
  ph.forEach(p=>{const q=(st.kind==="letters"?gP_mean(p):null)||gP_order(p)||gP_mean(p);if(q)out.push(q)});
  return out.slice(0,18);
}
function buildReview(){
  setPool();
  const all=learnedItems(),d=today();
  const pr=all.map(it=>{const r=S.srs[it.key]||{b:0,d:0};return [(r.d<=d?0:100)+r.b*3+(r.d-d)+Math.random()*2-(r.w||0)*.3,it]}).sort((a,b)=>a[0]-b[0]).slice(0,12).map(a=>a[1]);
  return shuffle(pr).map(it=>genFor(it,tierOf(it))).filter(Boolean);
}
function buildEar(){
  setPool();const out=[];
  shuffle(pool.W.filter(w=>learned(w)&&PAIRS[w.ar])).slice(0,4).forEach(w=>{const q=gW_pair(w);if(q)out.push(q)});
  shuffle(pool.W.filter(learned)).map(gW_heavy).filter(Boolean).slice(0,2).forEach(q=>out.push(q));
  shuffle(pool.L).forEach(l=>{if(out.length>=10)return;const q=pick([gL_sound,gL_form,gS_find,gL_pick,gL_name])(l)||gL_pick(l);if(q)out.push(q)});
  return shuffle(out).slice(0,10);
}
const DRILLS={
  review:{t:["Review","Повторение"],ok:()=>learnedItems().length>=4,build:buildReview},
  ear:{t:["Ear and letters","Слух и буквы"],ok:()=>{setPool();return pool.L.length>=2},build:buildEar},
  clitic:{t:["Little words that stick","Прилипающие слова"],ok:()=>WORDS.filter(w=>learned(w)&&CL_NOUNS.has(w.ar)).length>=2,build:()=>{setPool();const ns=pool.W.filter(w=>learned(w)&&CL_NOUNS.has(w.ar));return shuffle(ns.concat(ns,ns)).slice(0,10).map(gW_clitic).filter(Boolean)}},
  type:{t:["Listen and type","Слушайте и печатайте"],ok:()=>WORDS.filter(learned).length>=3,build:()=>{setPool();const a=shuffle([...WORDS,...PHRASES,...TEXTS.flatMap(t=>t.items)].filter(x=>learned(x)&&hasA(x.key)));const b=shuffle(WORDS.filter(learned));return uniq(a.concat(b)).map(gT_type).filter(Boolean).slice(0,10)}},
  saudi:{t:["Saudi spoken","Саудовская речь"],ok:()=>[...WORDS,...PHRASES].filter(x=>learned(x)&&x.step.kind==="spoken").length>=3,build:()=>{setPool();const it=shuffle([...WORDS,...PHRASES].filter(x=>learned(x)&&(x.step.kind==="spoken"||x.step.spoken)));return it.slice(0,12).map(x=>x.type==="W"?(pick([gW_mean,gW_pick,gW_pic])(x)||gW_mean(x)):(pick([gP_order,gP_mean])(x)||gP_mean(x))).filter(Boolean)}},
  syll:{t:["Syllables","Слоги"],ok:()=>{setPool();return pool.L.filter(l=>gS_read(l)).length>=2},build:()=>{setPool();const c=pool.L.filter(l=>gS_read(l));return shuffle(c.concat(c,c)).slice(0,12).map(l=>pick([gS_read,gS_find])(l)).filter(Boolean)}},
  inside:{t:["Letters inside words","Буквы внутри слов"],ok:()=>{setPool();return pool.L.filter(l=>gL_form(l)).length>=2},build:()=>{setPool();const ls=pool.L.filter(l=>gL_form(l));const out=[];for(let i=0;i<14;i++){const g=pick([gL_form,gL_form,gL_inword,"spot"]);const q=g==="spot"?gW_spot(pick(pool.W.filter(learned).length?pool.W.filter(learned):pool.W)):g(pick(ls));if(q)out.push(q)}return out.slice(0,12)}},
  alike:{t:["Look-alike letters","Похожие буквы"],ok:()=>{setPool();return pool.L.length>=3},build:()=>{setPool();return shuffle(pool.L).concat(shuffle(pool.L)).slice(0,12).map(l=>pick([gL_pick,gL_inword,gL_name])(l)||gL_pick(l)).filter(Boolean)}},
  sound:{t:["Sound twins","Звуковые близнецы"],ok:()=>{setPool();return pool.L.some(l=>gL_sound(l))},build:()=>{setPool();const c=pool.L.filter(l=>gL_sound(l));return shuffle(c.concat(c)).slice(0,12).map(gL_sound).filter(Boolean)}},
  spell:{t:["Build words","Собери слово"],ok:()=>{setPool();return WORDS.filter(learned).filter(w=>gW_spell(w)).length>=3},build:()=>{setPool();return shuffle(pool.W.filter(learned)).map(gW_spell).filter(Boolean).slice(0,10)}},
  roots:{t:["Roots and patterns","Корни и шаблоны"],ok:()=>{setPool();return WORDS.filter(learned).filter(w=>gW_root(w)||gW_pat(w)).length>=3},build:()=>{setPool();return shuffle(pool.W.filter(learned)).map(w=>shuffle([gW_root,gW_make,gW_pat]).map(g=>g(w)).find(Boolean)).filter(Boolean).slice(0,10)}},
  phrases:{t:["Phrases","Фразы"],ok:()=>PHRASES.filter(learned).length>=2,build:()=>{setPool();return shuffle(pool.P).concat(shuffle(pool.P)).slice(0,8).map(p=>pick([gP_order,gP_gap,gP_mean])(p)||gP_order(p)||gP_mean(p)).filter(Boolean)}},
  listen:{t:["Listening","Аудирование"],ok:()=>{setPool();return pool.W.filter(w=>hasA(w.key)).length+pool.L.filter(l=>hasA(l.key)).length>=4},build:()=>{setPool();return shuffle(pool.W.filter(w=>hasA(w.key)).map(gW_listen).concat(pool.L.filter(l=>hasA(l.key)).map(l=>gL_sound(l)||gL_pick(l)))).filter(Boolean).slice(0,12)}}
};
function startQuiz(qs,meta){
  if(!qs.length){toast(bi("Nothing to drill yet","Пока нечего тренировать"));return}
  Q=Object.assign({qs,i:0,ok:0,picked:[],answered:false,wrong:[]},meta);
  history.pushState({q:1},"");render();window.scrollTo(0,0);
}
function cur(){return Q&&Q.qs[Q.i]}
function renderQuiz(){
  if(Q.i>=Q.qs.length)return renderEnd();
  const q=cur(),pct=Math.round(Q.i/Q.qs.length*100);
  let h=`<section class="quiz"><div class="qhead"><button type="button" class="x" data-quit aria-label="Stop">×</button><div class="bar"><i style="width:${pct}%"></i></div><small>${Q.i+1}/${Q.qs.length}</small></div>
  <p class="qlabel">${bi(q.label[0],q.label[1])}</p><div class="qbox">${q.prompt}</div>`;
  if(q.kind==="type")h+=`<div class="built ar typed" id="typed" lang="ar" dir="rtl"></div><small class="hint ar" dir="rtl">${q.hint}</small>
   <div class="kb" dir="rtl">${KB.map(r=>`<div class="kbr">${r.map(c=>`<button type="button" class="kbk" data-kb="${c}">${c}</button>`).join("")}</div>`).join("")}
   <div class="kbr"><button type="button" class="kbk wide" data-kbsp>${bi("space","пробел")}</button><button type="button" class="kbk" data-kbbk aria-label="Delete">⌫</button></div></div>
   <button type="button" class="btn primary" data-tcheck>${bi("Check","Проверить")}</button>`;
  else if(q.kind==="choice")h+=`<div class="opts${q.one?" one":""}">${q.opts.map(o=>`<button type="button" class="opt" data-opt="${esc(o.k)}">${o.html}</button>`).join("")}</div>`;
  else h+=`<div class="built ar" id="built" lang="ar"></div><div class="tiles" dir="rtl">${q.tiles.map((t,i)=>`<button type="button" class="tile${q.words?" w":""}" data-tile="${i}">${esc(t)}</button>`).join("")}</div>
   <div class="row" style="justify-content:center"><button type="button" class="btn" data-undo>⌫ ${bi("Undo","Назад")}</button><button type="button" class="btn primary" data-check disabled>${bi("Check","Проверить")}</button></div>`;
  h+=`<div id="fb"></div><button type="button" class="btn primary big" data-next hidden>${bi("Next","Дальше")}</button></section>`;
  return h;
}
function afterQuiz(){
  const q=cur();
  if(q.audio)setTimeout(()=>play(q.audio,$(".qbox .spk")),250);
}
function itemReveal(it){
  if(!it)return "";
  if(it.type==="L")return `<div class="row"><span class="ar" style="font-size:40px">${it.c}</span><b class="ar lname">${it.name}</b><span>${bi(esc(it.cue[0]),esc(it.cue[1]))}</span>${spk(it.key)}</div>${it.mn?`<small>💡 ${bi(esc(it.mn[0]),esc(it.mn[1]))}</small>`:""}`;
  return `<div class="row"><span class="ar">${hl(it.ar,it.root)}</span>${spk(it.key)}${splitBtn(it.ar)}${trBtn(it)}</div><div>${bi(esc(it.en),esc(it.ru))}</div>`;
}
/* skills: last 40 answers per skill and per sound contrast */
const SKILLS=[
 ["shapes",["Letter shapes","Формы букв"],.85,["Find the letter","Which sound?","Which letter is pink?","Which letter is this?","Find its middle form","Find its start form","Find its end form"]],
 ["sounds",["Hearing sound contrasts","Различение звуков"],.9,["Which letter fits this sound?","Which one do you hear?","Which word did you hear?","Which one means this?","Tap the heavy letters, in order"]],
 ["vowels",["Vowels and syllables","Гласные и слоги"],.9,["Which vowel?","Find this syllable"]],
 ["words",["Word meaning","Значение слов"],.85,["Find the word","Which picture?","Which spelling is right?","What did you hear?"]],
 ["roots",["Roots and patterns","Корни и шаблоны"],.85,["Tap the root letters in order","Root + pattern = ?","Which pattern?","Which word has a different root?"]],
 ["clitics",["Attached words","Прилипающие слова"],.85,["What is inside this word?"]],
 ["typing",["Spelling and typing","Правописание и набор"],.8,["Build the word","Listen and type","Type the word"]],

 ["saudi",["Saudi spoken","Саудовская речь"],.85,[]]
];
const SKBYLABEL={};SKILLS.forEach(s=>s[3].forEach(l=>SKBYLABEL[l]=s[0]));
function skillsOf(q){
  const out=new Set();const l=q.label[0];
  if(SKBYLABEL[l])out.add(SKBYLABEL[l]);
  if(l==="What does it mean?")out.add(q.item.type==="W"?"words":"sentences");
  if(q.audio)out.add("listening");
  if(q.item.step&&(q.item.step.kind==="spoken"||q.item.step.spoken||(q.item.text&&q.item.text.spoken)))out.add("saudi");
  return [...out];
}
const push40=(o,k,v)=>{const a=o[k]||(o[k]=[]);a.push(v?1:0);if(a.length>40)a.shift()};
/* which two sounds a pair contrasts: vowel length, or the two letters that differ */
function contrastOf(a,b){const x=nrm(a),y=nrm(b);if(x.length!==y.length)return "length";for(let i=0;i<x.length;i++)if(x[i]!==y[i])return [x[i],y[i]].sort().join(" / ");return "other"}
function answer(ok,shownAns){
  const q=cur();Q.answered=true;grade(q.item.key,ok);

  const it=q.item;if(ok&&it.type!=="L"&&hasA(it.key)&&!q.audio)play(it.key,$("#fb .spk"));
  const nx=$("[data-next]");nx.hidden=false;
  if(ok&&S.auto&&q.kind==="choice"){const i=Q.i;setTimeout(()=>{if(Q&&Q.i===i&&Q.answered)next()},hasA(it.key)&&it.type!=="L"?1900:1100)}
  else nx.focus({preventScroll:true});
  renderStats();
}
function next(){if(!Q)return;Q.i++;Q.picked=[];Q.answered=false;Q.typed="";render();window.scrollTo(0,0);if(Q.i<Q.qs.length)afterQuiz()}
function pickOpt(btn){

function typedSet(v){if(!Q)return;Q.typed=v;const el=$("#typed");if(el)el.textContent=v}
function typeCheck(){
  const q=cur();if(Q.answered)return;const got=Q.typed||"";

/* Lesson pack: {id, title, roots?:{"ركب":["ride","ехать"]}, steps:[{t:[en,ru], en?, ru?, root?, words:[[ar,tr,en,ru,root,pat]], phrases:[[ar,tr,en,ru]]}]} */
const ARABIC_ONLY=/^[؀-ۿ\s]+$/;
function strWalk(v,path,errs){
  if(typeof v==="string"){if(/[<>]/.test(v))errs.push(path+': text contains "<" or ">"');else if(v.length>400)errs.push(path+": text is too long")}
  else if(Array.isArray(v))v.forEach((x,i)=>strWalk(x,path+"["+i+"]",errs));
  else if(v&&typeof v==="object")Object.keys(v).forEach(k=>strWalk(v[k],path+"."+k,errs));
}
function convertV1(raw){ /* packs from app version 1 grouped words by root */
  const steps=[],roots={};const codes={pl:"pl",dr:"dr",dn:"dn",mu:"mu"};
  (raw.roots||[]).forEach(r=>{if(!r||!Array.isArray(r.w))return;if(r.r)roots[r.r]=[String(r.en||""),String(r.ru||"")];
    steps.push({t:[(raw.units&&raw.units[r.u]&&raw.units[r.u][0])||String(r.en||"Words"),(raw.units&&raw.units[r.u]&&raw.units[r.u][1])||String(r.ru||"Слова")],root:r.r||"",
      words:r.w.map(w=>[w[0],w[1],w[2],w[3],r.r||"",codes[String(w[4]||"").split(" ")[0]]||""]),phrases:[]})});
  return {id:raw.id,title:raw.title||raw.id,roots,steps};
}
function validatePack(raw,others){
  if(!raw||typeof raw!=="object"||Array.isArray(raw))return{errs:["This is not a lesson pack (expected one JSON object)."]};
  if(!raw.steps&&Array.isArray(raw.roots))raw=convertV1(raw);
  const errs=[];strWalk(raw,"pack",errs);
  if(typeof raw.id!=="string"||!/^[a-z0-9][a-z0-9_-]{0,39}$/i.test(raw.id))errs.push('"id" must be a short name such as "food-2" (letters, numbers, - or _).');
  const roots={};
  if(raw.roots!=null){if(typeof raw.roots!=="object"||Array.isArray(raw.roots))errs.push('"roots" must look like {"ركب":["ride","ехать"]}.');
    else Object.keys(raw.roots).forEach(r=>{const m=raw.roots[r];if(!/^[ء-ي]{3,4}$/.test(r)||!Array.isArray(m)||typeof m[0]!=="string"||typeof m[1]!=="string")errs.push('Root "'+r+'" needs ["English","Русский"].');else roots[r]=[m[0],m[1]]})}
  const seen=new Set();C.steps.forEach(s=>{(s.words||[]).forEach(w=>seen.add("W:"+w[0]));(s.phrases||[]).forEach(p=>seen.add("P:"+p[0]))});
  others.forEach(o=>o.steps.forEach(s=>{s.words.forEach(w=>seen.add("W:"+w[0]));s.phrases.forEach(p=>seen.add("P:"+p[0]))}));
  const steps=[];
  if(!Array.isArray(raw.steps)||!raw.steps.length)errs.push('"steps" must be a list with at least one step.');
  else{
    if(raw.steps.length>30)errs.push("A pack can hold up to 30 steps.");
    raw.steps.forEach((s,i)=>{
      const at="steps["+i+"]";
      if(!s||typeof s!=="object"){errs.push(at+" is not an object.");return}
      if(!Array.isArray(s.t)||typeof s.t[0]!=="string"||typeof s.t[1]!=="string"||!s.t[0]||!s.t[1])errs.push(at+': "t" must be ["English title","Русское название"].');
      const root=typeof s.root==="string"?s.root:"";
      if(root&&!/^[ء-ي]{3,4}$/.test(root))errs.push(at+': root "'+root+'" must be 3 or 4 Arabic letters without vowel marks.');
      const words=[],phrases=[];
      (Array.isArray(s.words)?s.words:[]).forEach((w,j)=>{const wa=at+".words["+j+"]";
        if(!Array.isArray(w)||w.length<4||[0,1,2,3].some(k=>typeof w[k]!=="string"||!w[k])){errs.push(wa+": a word is [arabic, transliteration, English, Russian, root, pattern].");return}
        if(!ARABIC_ONLY.test(w[0])||/\s/.test(w[0].trim()))errs.push(wa+": the first item must be one Arabic word.");
        const wr=typeof w[4]==="string"?w[4]:"",wp=typeof w[5]==="string"?w[5]:"";
        if(wr&&!/^[ء-ي]{3,4}$/.test(wr))errs.push(wa+": root must be 3 or 4 Arabic letters.");
        if(wp&&!C.pats[wp])errs.push(wa+': unknown pattern code "'+wp+'".');
        if(seen.has("W:"+w[0]))errs.push(wa+": "+w[0]+" is already in the app.");seen.add("W:"+w[0]);
        words.push([w[0].trim(),w[1],w[2],w[3],wr,wp])});
      (Array.isArray(s.phrases)?s.phrases:[]).forEach((p,j)=>{const pa=at+".phrases["+j+"]";
        if(!Array.isArray(p)||p.length<4||[0,1,2,3].some(k=>typeof p[k]!=="string"||!p[k])){errs.push(pa+": a phrase is [arabic, transliteration, English, Russian].");return}
        if(!ARABIC_ONLY.test(p[0]))errs.push(pa+": must be Arabic text.");
        if(seen.has("P:"+p[0]))errs.push(pa+": "+p[0]+" is already in the app.");seen.add("P:"+p[0]);
        phrases.push([p[0].trim(),p[1],p[2],p[3]])});
      if(!words.length&&!phrases.length)errs.push(at+": needs at least one word or phrase.");
      steps.push({t:[s.t&&s.t[0]||"",s.t&&s.t[1]||""],en:typeof s.en==="string"?s.en:"",ru:typeof s.ru==="string"?s.ru:"",root,words,phrases});
    });
  }
  if(errs.length)return{errs};
  return{pack:{id:raw.id,title:typeof raw.title==="string"?raw.title:raw.id,roots,steps}};
}
function importPackText(text){
  text=String(text||"").trim().replace(/^```[a-z]*\s*/i,"").replace(/\s*```$/,"");
  if(!text)return setMsg("pack","bad",bi("Paste a lesson pack first, or choose a file.","Сначала вставьте пакет или выберите файл."));
  let raw;try{raw=JSON.parse(text)}catch(e){return setMsg("pack","bad","Not valid JSON ("+esc(e.message)+"). Copy the whole code block from Claude’s reply.")}
  const others=PACKS.filter(p=>!(raw&&raw.id===p.id));
  const res=validatePack(raw,others);
  if(!res.pack)return setMsg("pack","bad","<b>"+bi("Could not add this pack.","Не удалось добавить пакет.")+"</b>"+errList(res.errs));
  const pack=res.pack,existed=PACKS.some(p=>p.id===pack.id),next=others.concat([pack]);
  if(!savePacks(next))return setMsg("pack","bad","Could not save: browser storage is full or blocked.");

  if(e.key&&e.key.length===1&&/[\u0621-\u064A]/.test(e.key)){e.preventDefault();typedSet((Q.typed||"")+e.key)}
});
window.addEventListener("popstate",()=>{if(ignorePop){ignorePop=false;return}if(sheetOpen)return closeSheet(true);if(Q){Q=null;return render()}if(UI.step){UI.step=null;return render()}});

/* ================= boot ================= */
(function boot(){
  try{const raw=localStorage.getItem("jidr-packs");const a=raw?JSON.parse(raw):[];
    if(Array.isArray(a)){const ok=[];a.forEach(p=>{const r=validatePack(p,ok);if(r.pack)ok.push(r.pack)});PACKS=ok}}catch(e){}
  buildData();
  S.done=S.done.filter(id=>STEPS.some(s=>s.id===id));
  const h=location.hash.slice(1);if(TABS.includes(h))S.tab=h;
  render();
  loadAudio();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    navigator.serviceWorker.ready.then(()=>{swReady=true;refreshDevice()}).catch(()=>{});
  }
  if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(p=>p||(navigator.storage.persist?navigator.storage.persist():false)).then(p=>{persisted=!!p;refreshDevice()}).catch(()=>{});
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;refreshDevice()});
  window.addEventListener("appinstalled",()=>{deferredInstall=null;refreshDevice()});
})();
</script>
